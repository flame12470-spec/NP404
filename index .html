<style>
:root {
  --bg: #f3f6fb;
  --surface: #ffffff;
  --surface-soft: #f8fafd;
  --border: #e2e8f0;
  --ink: #0f172a;
  --muted: #64748b;
  --brand: #1e6091;
  --brand-light: #e0f2fe;
  --brand-ink: #ffffff;
  --accent: #ea580c;
  --accent-light: #ffedd5;
  --success: #15803d;
  --success-bg: #dcfce7;
  --warning: #b45309;
  --warning-bg: #fef3c7;
  --danger: #b91c1c;
  --danger-bg: #fee2e2;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.06);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --font: 'Prompt', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}

button {
  font: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
  touch-action: manipulation;
}

input, select, textarea {
  font: inherit;
  font-size: 15px;
  color: var(--ink);
}

.hide {
  display: none !important;
}

/* App Shell */
.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}

/* Top Header - No overlap issue on mobile or desktop */
.top-header {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: calc(12px + var(--sat)) 16px 12px;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
}

.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.brand-icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--brand), #2980b9);
  color: #fff;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  box-shadow: 0 3px 8px rgba(30, 96, 145, 0.25);
}

.brand-icon svg {
  width: 24px;
  height: 24px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.brand-text {
  min-width: 0;
}

.brand-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.brand-sub {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sync-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
  display: inline-block;
  flex-shrink: 0;
}
.sync-dot.busy {
  background: #eab308;
}
.sync-dot.err {
  background: #ef4444;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.role-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: var(--surface-soft);
  color: var(--muted);
  transition: 0.15s;
}

.role-badge.leader {
  background: var(--accent-light);
  border-color: #fdba74;
  color: var(--accent);
}

.role-badge svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
}

/* Main Workspace */
.workspace {
  flex: 1;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding: 16px 16px calc(90px + var(--sab));
  gap: 20px;
}

/* Navigation Bar (Bottom on mobile, Sidebar on desktop) */
.nav-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 30;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  align-items: stretch;
  padding: 6px 6px calc(8px + var(--sab));
  box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.05);
  overflow-x: auto;
}

.nav-btn {
  flex: 1;
  min-width: 58px;
  padding: 6px 4px;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  transition: 0.15s;
  white-space: nowrap;
}

.nav-btn svg {
  width: 21px;
  height: 21px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.nav-btn:hover {
  color: var(--ink);
  background: var(--surface-soft);
}

.nav-btn.active {
  color: var(--brand);
  background: var(--brand-light);
  font-weight: 600;
}

@media (min-width: 900px) {
  .workspace {
    flex-direction: row;
    align-items: flex-start;
    padding: 24px 24px 48px;
    gap: 24px;
  }

  .nav-bar {
    position: sticky;
    top: 84px;
    bottom: auto;
    width: 240px;
    flex-shrink: 0;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    box-shadow: var(--shadow);
    gap: 4px;
  }

  .nav-btn {
    flex-direction: row;
    justify-content: flex-start;
    padding: 11px 14px;
    font-size: 14px;
    gap: 12px;
  }

  .nav-btn svg {
    width: 20px;
    height: 20px;
  }
}

.main-content {
  flex: 1;
  min-width: 0;
  width: 100%;
}

/* Common Layout & Cards */
.section-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.section-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
}

.section-desc {
  font-size: 13px;
  color: var(--muted);
  margin-top: 2px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
}

.stat-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}

.stat-label {
  font-size: 13px;
  color: var(--muted);
}

.stat-val {
  font-size: 24px;
  font-weight: 700;
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  transition: 0.15s;
  white-space: nowrap;
}

.btn:hover {
  background: var(--surface-soft);
}

.btn:active {
  transform: scale(0.98);
}

.btn-primary {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}
.btn-primary:hover {
  background: #164e78;
}

.btn-accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn-accent:hover {
  background: #c2410c;
}

.btn-danger {
  background: var(--danger-bg);
  border-color: #fecaca;
  color: var(--danger);
}
.btn-danger:hover {
  background: #fecaca;
}

.btn-sm {
  padding: 6px 11px;
  font-size: 12px;
  border-radius: 8px;
}

.btn-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/* Badges / Tags */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}
.badge-ok { background: var(--success-bg); color: var(--success); }
.badge-warn { background: var(--warning-bg); color: var(--warning); }
.badge-err { background: var(--danger-bg); color: var(--danger); }
.badge-info { background: var(--brand-light); color: var(--brand); }

/* Forms & Inputs */
.form-group {
  margin-bottom: 14px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 6px;
}

.input, select.input, textarea.input {
  width: 100%;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  outline: none;
  transition: border-color 0.15s;
}

.input:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(30, 96, 145, 0.12);
}

textarea.input {
  min-height: 96px;
  resize: vertical;
}

.form-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
}

/* Tables & Lists */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}

table.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

table.data-table th,
table.data-table td {
  padding: 11px 14px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}

table.data-table th {
  background: var(--surface-soft);
  font-weight: 600;
  color: var(--muted);
  font-size: 13px;
  white-space: nowrap;
}

table.data-table tr:last-child td {
  border-bottom: none;
}

table.data-table tr:hover td {
  background: #f8fafc;
}

.num-col {
  text-align: right !important;
  font-variant-numeric: tabular-nums;
}

/* Item List */
.item-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  flex-wrap: wrap;
}

.stu-no {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--brand-light);
  color: var(--brand);
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
}

/* Progress bar */
.progress {
  height: 8px;
  border-radius: 99px;
  background: var(--border);
  overflow: hidden;
  margin: 8px 0;
}
.progress > i {
  display: block;
  height: 100%;
  background: var(--brand);
  border-radius: 99px;
  transition: width 0.3s;
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 36px 20px;
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  color: var(--muted);
}

.empty-state b {
  display: block;
  color: var(--ink);
  font-size: 16px;
  margin-bottom: 4px;
}

/* Modal / Sheet */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.45);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

.modal-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

.modal-box {
  background: var(--surface);
  border-radius: 18px;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  max-height: 90dvh;
  overflow-y: auto;
  padding: 22px;
  box-shadow: var(--shadow-lg);
}

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.modal-head h3 {
  font-size: 18px;
  font-weight: 700;
}

.close-x {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--surface-soft);
  display: grid;
  place-items: center;
  font-size: 16px;
  color: var(--muted);
}

/* Filter Pill Tabs */
.pill-tabs {
  display: inline-flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 4px;
  gap: 4px;
  margin-bottom: 16px;
  max-width: 100%;
  overflow-x: auto;
}

.pill-tabs button {
  padding: 6px 14px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  white-space: nowrap;
}

.pill-tabs button.active {
  background: var(--brand);
  color: #fff;
}

.day-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
}

.day-head {
  font-weight: 700;
  font-size: 15px;
  padding-bottom: 8px;
  margin-bottom: 10px;
  border-bottom: 2px solid var(--brand-light);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.thumb-preview {
  max-width: 100%;
  max-height: 220px;
  object-fit: contain;
  border-radius: 10px;
  border: 1px solid var(--border);
  margin-top: 8px;
}
</style>

  const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('classfund_v1');
  if (raw) {
    const parsed = JSON.parse(raw);
    S = Object.assign(defaultState(), parsed || {});
    if (!S.cls || typeof S.cls !== 'object') S.cls = { name: '', term: '', leader: '', advisor: '', pin: DEFAULT_PIN };
    if (!S.cls.pin) S.cls.pin = DEFAULT_PIN;
    if (!S.duties) S.duties = { 'จันทร์': [], 'อังคาร': [], 'พุธ': [], 'พฤหัสบดี': [], 'ศุกร์': [] };
    if (!S.attendance) S.attendance = {};
  }
} catch (e) {}

let isLeader = false;
try { isLeader = sessionStorage.getItem(AUTH_SESSION_KEY) === '1'; } catch (e) {}

let curView = 'home';
let fundTab = 'rounds'; // 'rounds' | 'roundDetail' | 'exps'
let curRoundId = null;
let roundFilter = 'all'; // 'all' | 'unpaid' | 'paid'
let searchQ = '';
let attDate = todayKey();
let tempImgData = null;
let imgCallback = null;

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function formatDate(k) {
  if (!k) return '-';
  const p = k.split('-');
  if (p.length !== 3) return esc(k);
  return (+p[2]) + ' ' + MONTHS_TH[+p[1] - 1] + ' ' + ((+p[0] + 543) % 100);
}

function formatMoney(n) {
  n = Math.round((+n || 0) * 100) / 100;
  return n.toLocaleString('th-TH', { maximumFractionDigits: 2 });
}

function setSyncDot(st) {
  const d = $('syncDot');
  if (!d) return;
  d.className = 'sync-dot' + (st === 'busy' ? ' busy' : st === 'err' ? ' err' : '');
}

async function loadCloud() {
  if (!sb) return;
  setSyncDot('busy');
  try {
    const { data, error } = await sb.from('class_fund_state').select('data').eq('id', DOC_ROW_ID).maybeSingle();
    if (error) throw error;
    if (data && data.data) {
      const merged = Object.assign(defaultState(), data.data);
      if (!merged.cls || typeof merged.cls !== 'object') merged.cls = { name: '', term: '', leader: '', advisor: '', pin: DEFAULT_PIN };
      if (merged.cls.treasurer && !merged.cls.leader) merged.cls.leader = merged.cls.treasurer;
      if (!merged.cls.pin) merged.cls.pin = DEFAULT_PIN;
      if (!merged.duties) merged.duties = { 'จันทร์': [], 'อังคาร': [], 'พุธ': [], 'พฤหัสบดี': [], 'ศุกร์': [] };
      if (!merged.attendance) merged.attendance = {};
      S = merged;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) {}
      render();
    }
    setSyncDot('ok');
  } catch (e) {
    setSyncDot('err');
  }
}

async function saveCloud() {
  if (!sb) return;
  setSyncDot('busy');
  try {
    const { error } = await sb.from('class_fund_state').upsert({
      id: DOC_ROW_ID,
      data: S,
      updated_at: new Date().toISOString()
    }, { onConflict: 'id' });
    if (error) throw error;
    setSyncDot('ok');
  } catch (e) {
    setSyncDot('err');
  }
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) {}
  saveCloud();
}

/* ---------- Financial & Class Calculations ---------- */
function paidByStu(rid, sid) {
  return S.pays.filter(p => p.rid === rid && p.sid === sid).reduce((sum, p) => sum + (+p.amt || 0), 0);
}

function roundStat(r) {
  const n = S.students.length;
  let full = 0, part = 0, got = 0;
  S.students.forEach(s => {
    const p = paidByStu(r.id, s.id);
    got += p;
    if (p >= r.amt && r.amt > 0) full++;
    else if (p > 0) part++;
  });
  return {
    n, full, part,
    unpaid: Math.max(0, n - full),
    got,
    target: r.amt * n,
    pct: n ? Math.round((full / n) * 100) : 0
  };
}

const totalIncome = () => S.pays.reduce((a, p) => a + (+p.amt || 0), 0);
const totalSpent = () => S.exps.reduce((a, e) => a + (+e.amt || 0), 0);

  if (c.leader) subParts.push('หัวหน้าห้อง: ' + c.leader);
  if (c.advisor) subParts.push('ครูที่ปรึกษา: ' + c.advisor);
  $('hdrClassSub').textContent = subParts.length ? subParts.join(' · ') : 'สำหรับนักเรียนและหัวหน้าห้อง';

  const roleBtn = $('roleBtn');

    roleLabel.textContent = 'โหมดหัวหน้าห้อง (จัดการได้)';

    roleBtn.classList.remove('leader');

  $('mainNav').innerHTML = NAV_ITEMS.map(item => `
    <button class="nav-btn ${curView === item.id ? 'active' : ''}" data-act="nav" data-v="${item.id}">
      ${item.icon}
      <span>${item.label}</span>

  `).join('');

  const viewMap = {
    home: V_home,
    news: V_news,
    schedule: V_schedule,
    homework: V_homework,
    duty: V_duty,
    attendance: V_attendance,
    fund: V_fund,
    members: V_members
  };

  $('mainView').innerHTML = (viewMap[curView] || V_home)();
}

      <div class="stat-box"><div class="stat-label">ลา</div><div class="stat-val" style="color:var(--brand)">${cntLeave}</div></div>
      <div class="stat-box"><div class="stat-label">ขาดเรียน</div><div class="stat-val" style="color:var(--danger)">${cntAbsent}</div></div>

/* ---------- Modal Helpers ---------- */
function openModal(title, bodyHtml) {
  $('modalContent').innerHTML = `
    <div class="modal-head">
      <h3>${title}</h3>
      <button class="close-x" data-act="closeModal" aria-label="ปิด">✕</button>
    </div>
    <div>${bodyHtml}</div>
  `;
  $('modalBackdrop').classList.add('open');
}

function closeModal() {
  $('modalBackdrop').classList.remove('open');
  tempImgData = null;
  imgCallback = null;
}

function askImage(cb) {
  imgCallback = cb;
  const inp = $('fileInputImg');
  inp.value = '';
  inp.click();
}

$('fileInputImg').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 720;
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.68);
      if (imgCallback) imgCallback(dataUrl);
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
});

$('fileInputJson').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const parsed = JSON.parse(fr.result);
      if (parsed && typeof parsed === 'object') {
        S = Object.assign(defaultState(), parsed);
        saveState();
        render();
      }
    } catch (err) {}
  };
  fr.readAsText(file);
});

          <label class="form-label">วัน</label>
          <select class="input" id="schDay">
            ${DAYS_TH.map(d => `<option value="${d}">วัน${d}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">เวลา / คาบเรียน</label>
          <input type="text" class="input" id="schTime" placeholder="เช่น 08:30 - 09:20">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">ชื่อวิชา</label>
        <input type="text" class="input" id="schSubj" placeholder="เช่น คณิตศาสตร์พื้นฐาน">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">ห้องเรียน</label>
          <input type="text" class="input" id="schRoom" placeholder="เช่น ห้อง 324">
        </div>
        <div class="form-group">
          <label class="form-label">อาจารย์ผู้สอน</label>
          <input type="text" class="input" id="schTeacher" placeholder="ไม่ระบุก็ได้">
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%" data-act="saveSchedule">บันทึกตารางเรียน</button>
    `);
  },
  saveSchedule() {
    const subject = $('schSubj').value.trim();
    if (!subject) return;
    S.schedules.push({
      id: uid('sc'),
      day: $('schDay').value,
      time: $('schTime').value.trim(),
      subject,
      room: $('schRoom').value.trim(),
      teacher: $('schTeacher').value.trim()
    });
    saveState();
    closeModal();
    render();
  },
  delSchedule(el) {
    S.schedules = S.schedules.filter(x => x.id !== el.dataset.id);
    saveState();
    render();
  },

  /* Homework */
  openAddHomework() {
    openModal('เพิ่มการบ้าน / งานที่มอบหมาย', `
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">วิชา</label>
          <input type="text" class="input" id="hwSubj" placeholder="เช่น ภาษาไทย">
        </div>
        <div class="form-group">
          <label class="form-label">กำหนดส่ง</label>
          <input type="date" class="input" id="hwDue" value="${todayKey()}">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">หัวข้องาน / การบ้าน</label>
        <input type="text" class="input" id="hwTitle" placeholder="เช่น แบบฝึกหัดบทที่ 3 หน้า 45">
      </div>
      <div class="form-group">
        <label class="form-label">รายละเอียดเพิ่มเติม</label>
        <textarea class="input" id="hwNote" placeholder="เช่น ทำใส่สมุดส่งที่โต๊ะครู"></textarea>
      </div>
      <button class="btn btn-primary" style="width:100%" data-act="saveHomework">บันทึกการบ้าน</button>
    `);
  },
  saveHomework() {
    const title = $('hwTitle').value.trim();
    const subject = $('hwSubj').value.trim() || 'ทั่วไป';
    if (!title) return;
    S.homeworks.push({
      id: uid('hw'),
      subject,
      title,
      due: $('hwDue').value,
      note: $('hwNote').value.trim()
    });
    saveState();
    closeModal();
    render();
  },
  delHomework(el) {
    S.homeworks = S.homeworks.filter(x => x.id !== el.dataset.id);
    saveState();
    render();
  },

  /* Duty Roster */
  openEditDuty(el) {
    const day = el.dataset.day;
    const current = (S.duties && S.duties[day]) || [];
    openModal(`จัดการเวรวัน${day}`, `
      <div class="form-group">
        <label class="form-label">พิมพ์รายชื่อคนทำเวรวัน${day} (บรรทัดละ 1 ชื่อ)</label>
        <textarea class="input" id="dutyText" style="min-height:150px" placeholder="สมชาย ใจดี&#10;สมหญิง รักเรียน">${esc(current.join('\n'))}</textarea>
      </div>
      ${S.students.length ? `
        <div class="form-group">
          <label class="form-label">หรือแตะเพื่อเพิ่มจากรายชื่อในห้อง:</label>
          <div class="btn-group" style="max-height:130px;overflow-y:auto;padding:4px">
            ${S.students.map(s => `<button type="button" class="btn btn-sm" data-act="appendDutyName" data-name="${esc(s.name)}">+ ${esc(s.name)}</button>`).join('')}
          </div>
        </div>
      ` : ''}
      <button class="btn btn-primary" style="width:100%" data-act="saveDutyDay" data-day="${day}">บันทึกรายชื่อเวร</button>
    `);
  },
  appendDutyName(el) {
    const ta = $('dutyText');
    if (!ta) return;
    const name = el.dataset.name;
    ta.value = (ta.value.trim() ? ta.value.trim() + '\n' : '') + name;
  },
  saveDutyDay(el) {
    const day = el.dataset.day;
    const names = $('dutyText').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    if (!S.duties) S.duties = {};
    S.duties[day] = names;
    saveState();
    closeModal();
    render();
  },
  removeDutyMember(el) {
    const day = el.dataset.day;
    const idx = +el.dataset.idx;
    if (S.duties && Array.isArray(S.duties[day])) {
      S.duties[day].splice(idx, 1);
      saveState();
      render();
    }
  },

  /* Attendance */
  setAtt(el) {
    if (!isLeader) return;
    if (!S.attendance) S.attendance = {};
    if (!S.attendance[attDate]) S.attendance[attDate] = {};
    S.attendance[attDate][el.dataset.sid] = el.dataset.st;
    saveState();
    render();
  },
  markAllPresent() {
    if (!isLeader) return;
    if (!S.attendance) S.attendance = {};
    if (!S.attendance[attDate]) S.attendance[attDate] = {};
    S.students.forEach(s => { S.attendance[attDate][s.id] = 'มา'; });
    saveState();
    render();
  },

  /* Class Fund */
  setFundTab(el) {
    fundTab = el.dataset.v;
    render();
  },
  openRoundDetail(el) {
    curRoundId = el.dataset.id;
    fundTab = 'roundDetail';
    roundFilter = 'all';
    searchQ = '';
    render();
  },
  backToRounds() {
    fundTab = 'rounds';
    render();
  },
  setRoundFilter(el) {
    roundFilter = el.dataset.v;
    render();
  },
  openAddRound() {
    openModal('สร้างรายการเก็บเงินใหม่', `
      <div class="form-group">
        <label class="form-label">ชื่อรายการเก็บเงิน</label>
        <input type="text" class="input" id="rndTitle" placeholder="เช่น ค่ากิจกรรมห้อง เทอม 1">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">จำนวนเงิน (บาท/คน)</label>
          <input type="number" class="input" id="rndAmt" min="1" step="any" placeholder="เช่น 100">
        </div>
        <div class="form-group">
          <label class="form-label">กำหนดส่ง</label>
          <input type="date" class="input" id="rndDue" value="${todayKey()}">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">หมายเหตุ</label>
        <input type="text" class="input" id="rndNote" placeholder="เช่น โอนเข้าบัญชีเหรัญญิกได้">
      </div>
      <button class="btn btn-primary" style="width:100%" data-act="saveRound">สร้างรายการเก็บเงิน</button>
    `);
  },
  saveRound() {
    const title = $('rndTitle').value.trim();
    const amt = parseFloat($('rndAmt').value);
    if (!title || !(amt > 0)) return;
    S.rounds.push({
      id: uid('r'),
      title,
      amt,
      due: $('rndDue').value,
      note: $('rndNote').value.trim()
    });
    saveState();
    closeModal();
    render();
  },
  delRound(el) {
    const id = el.dataset.id;
    S.rounds = S.rounds.filter(r => r.id !== id);
    S.pays = S.pays.filter(p => p.rid !== id);
    fundTab = 'rounds';
    saveState();
    render();
  },
  openStuPayModal(el) {
    const rid = el.dataset.rid;
    const sid = el.dataset.sid;
    const r = S.rounds.find(x => x.id === rid);
    const s = S.students.find(x => x.id === sid);
    if (!r || !s) return;
    tempImgData = null;
    const history = S.pays.filter(p => p.rid === rid && p.sid === sid);
    const paid = paidByStu(rid, sid);
    const rem = Math.max(0, r.amt - paid);

    openModal(`${s.no}. ${s.name}`, `
      <p style="font-size:13px;color:var(--muted);margin-bottom:12px">
        รายการ: <b>${esc(r.title)}</b> (${formatMoney(r.amt)} บาท) · จ่ายแล้ว <b style="color:var(--success)">${formatMoney(paid)}</b> · ค้าง <b style="color:var(--danger)">${formatMoney(rem)}</b>
      </p>

      <h4 style="font-size:14px;margin-bottom:8px">ประวัติการชำระเงิน</h4>
      ${history.length ? `<div class="item-list" style="margin-bottom:16px">${history.map(p => `
        <div class="list-row" style="padding:8px 12px">
          <div>
            <b style="color:var(--success)">+${formatMoney(p.amt)} บาท</b>
            <span style="font-size:12px;color:var(--muted);display:block">${formatDate(p.date)} · ${esc(p.method)}</span>
          </div>
          <div class="btn-group">
            ${p.slip ? `<button class="btn btn-sm" data-act="viewImgModal" data-title="สลิป ${esc(s.name)}" data-src="${p.slip}">ดูสลิป</button>` : ''}
            ${isLeader ? `<button class="btn btn-danger btn-sm" data-act="delPayItem" data-id="${p.id}" data-rid="${rid}" data-sid="${sid}">ลบ</button>` : ''}
          </div>
        </div>
      `).join('')}</div>` : `<p style="font-size:13px;color:var(--muted);margin-bottom:16px">ยังไม่มีประวัติการชำระเงินในรายการนี้</p>`}

      ${isLeader ? `
        <div style="border-top:1px solid var(--border);padding-top:14px">
          <h4 style="font-size:14px;margin-bottom:10px">บันทึกรับเงินเพิ่ม (หัวหน้าห้อง)</h4>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">จำนวนเงิน (บาท)</label>
              <input type="number" class="input" id="payAmtInput" value="${rem > 0 ? rem : ''}" min="1" step="any">
            </div>
            <div class="form-group">
              <label class="form-label">วิธีชำระ</label>
              <select class="input" id="payMethodInput">
                <option value="เงินสด">เงินสด</option>
                <option value="โอนเงิน">โอนเงิน</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <button type="button" class="btn btn-sm" data-act="attachSlipImg">แนบรูปสลิป (ถ้ามี)</button>
            <div id="slipPreviewBox"></div>
          </div>
          <button class="btn btn-primary" style="width:100%" data-act="saveStuPay" data-rid="${rid}" data-sid="${sid}">บันทึกรับเงิน</button>
        </div>
      ` : ''}
    `);
  },
  attachSlipImg() {
    askImage(dataUrl => {
      tempImgData = dataUrl;
      const box = $('slipPreviewBox');
      if (box) box.innerHTML = `<img src="${dataUrl}" class="thumb-preview" alt="สลิป">`;
    });
  },
  saveStuPay(el) {
    const rid = el.dataset.rid;
    const sid = el.dataset.sid;
    const amt = parseFloat($('payAmtInput').value);
    if (!(amt > 0)) return;
    S.pays.push({
      id: uid('p'),
      rid,
      sid,
      amt,
      method: $('payMethodInput').value,
      date: todayKey(),
      slip: tempImgData
    });
    saveState();
    closeModal();
    render();
  },
  delPayItem(el) {
    S.pays = S.pays.filter(p => p.id !== el.dataset.id);
    saveState();
    ACT.openStuPayModal(el);
    render();
  },
  openAddExp() {
    tempImgData = null;
    openModal('บันทึกรายจ่ายของห้อง', `
      <div class="form-group">
        <label class="form-label">รายการเบิกจ่าย</label>
        <input type="text" class="input" id="expTitle" placeholder="เช่น ซื้ออุปกรณ์จัดบอร์ดห้อง">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">จำนวนเงิน (บาท)</label>
          <input type="number" class="input" id="expAmt" min="1" step="any" placeholder="เช่น 250">
        </div>
        <div class="form-group">
          <label class="form-label">วันที่จ่าย</label>
          <input type="date" class="input" id="expDate" value="${todayKey()}">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">หมายเหตุ</label>
        <input type="text" class="input" id="expNote" placeholder="ไม่ระบุก็ได้">
      </div>
      <div class="form-group">
        <button type="button" class="btn btn-sm" data-act="attachExpImg">แนบรูปใบเสร็จ (ถ้ามี)</button>
        <div id="expPreviewBox"></div>
      </div>
      <button class="btn btn-accent" style="width:100%" data-act="saveExp">บันทึกรายจ่าย</button>
    `);
  },
  attachExpImg() {
    askImage(dataUrl => {
      tempImgData = dataUrl;
      const box = $('expPreviewBox');
      if (box) box.innerHTML = `<img src="${dataUrl}" class="thumb-preview" alt="ใบเสร็จ">`;
    });
  },
  saveExp() {
    const title = $('expTitle').value.trim();
    const amt = parseFloat($('expAmt').value);
    if (!title || !(amt > 0)) return;
    S.exps.push({
      id: uid('e'),
      title,
      amt,
      date: $('expDate').value || todayKey(),
      note: $('expNote').value.trim(),
      receipt: tempImgData
    });
    fundTab = 'exps';
    saveState();
    closeModal();
    render();
  },
  delExp(el) {
    S.exps = S.exps.filter(e => e.id !== el.dataset.id);
    saveState();
    render();
  },
  viewImgModal(el) {
    openModal(el.dataset.title || 'รูปภาพแนบ', `
      <img src="${el.dataset.src}" style="width:100%;border-radius:12px" alt="หลักฐาน">
    `);
  },
  copyUnpaidList(el) {
    const r = S.rounds.find(x => x.id === el.dataset.id);
    if (!r) return;
    const list = S.students.filter(s => paidByStu(r.id, s.id) < r.amt);
    const txt = list.length
      ? `แจ้งรายชื่อค้างชำระ "${r.title}" (${formatMoney(r.amt)} บาท/คน)\n` + list.map(s => `${s.no}. ${s.name} (ค้าง ${formatMoney(r.amt - paidByStu(r.id, s.id))} บ.)`).join('\n')
      : `รายการ "${r.title}" สมาชิกจ่ายครบทุกคนแล้ว`;
    openModal('คัดลอกรายชื่อคนค้างส่งไลน์', `
      <textarea class="input" style="min-height:180px" readonly>${esc(txt)}</textarea>
    `);
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).catch(() => {});
  },
  copyFundSummary() {
    const c = S.cls || {};
    let txt = `สรุปบัญชีเงินห้อง ${c.name || ''}\nอัปเดต: ${formatDate(todayKey())}\n`;
    txt += `รายรับรวม: ${formatMoney(totalIncome())} บาท\nรายจ่ายรวม: ${formatMoney(totalSpent())} บาท\nคงเหลือสุทธิ: ${formatMoney(totalIncome() - totalSpent())} บาท\n`;
    S.rounds.forEach(r => {
      const st = roundStat(r);
      txt += `\n- ${r.title} (${formatMoney(r.amt)} บ./คน): จ่ายครบ ${st.full}/${st.n} คน`;
    });
    openModal('สรุปยอดเงินห้อง', `
      <textarea class="input" style="min-height:180px" readonly>${esc(txt)}</textarea>
    `);
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).catch(() => {});
  },

  /* Members Management */
  openAddStudents() {
    openModal('เพิ่มรายชื่อนักเรียน', `
      <div class="form-group">
        <label class="form-label">วางหรือพิมพ์รายชื่อนักเรียน (บรรทัดละ 1 ชื่อ)</label>
        <textarea class="input" id="bulkStuInput" style="min-height:160px" placeholder="1 สมชาย ใจดี&#10;2 สมหญิง รักเรียน"></textarea>
        <small style="color:var(--muted);font-size:12px">ระบบจะตัดเลขนำหน้าและรันเลขที่ต่อให้อัตโนมัติ</small>
      </div>
      <button class="btn btn-primary" style="width:100%" data-act="saveBulkStudents">เพิ่มรายชื่อเข้าห้อง</button>
    `);
  },
  saveBulkStudents() {
    const raw = $('bulkStuInput').value;
    const names = raw.split(/\r?\n/).map(l => l.replace(/^\s*\d+\s*[.)\-:]?\s*/, '').trim()).filter(Boolean);
    if (!names.length) return;
    let nextNo = S.students.length;
    names.forEach(name => {
      S.students.push({ id: uid('s'), no: String(++nextNo), name });
    });
    saveState();
    closeModal();
    render();
  },
  openEditStudent(el) {
    const s = S.students.find(x => x.id === el.dataset.id);
    if (!s) return;
    openModal('แก้ไขข้อมูลนักเรียน', `
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">เลขที่</label>
          <input type="text" class="input" id="editStuNo" value="${esc(s.no)}">
        </div>
        <div class="form-group">
          <label class="form-label">ชื่อ - นามสกุล</label>
          <input type="text" class="input" id="editStuName" value="${esc(s.name)}">
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%" data-act="saveEditStudent" data-id="${s.id}">บันทึกการแก้ไข</button>
    `);
  },
  saveEditStudent(el) {
    const s = S.students.find(x => x.id === el.dataset.id);
    if (!s) return;
    const name = $('editStuName').value.trim();
    if (!name) return;
    s.no = $('editStuNo').value.trim() || s.no;
    s.name = name;
    saveState();
    closeModal();
    render();
  },
  delStudent(el) {
    const id = el.dataset.id;
    S.students = S.students.filter(s => s.id !== id);
    S.pays = S.pays.filter(p => p.sid !== id);
    saveState();
    render();
  },
  syncNow() {
    loadCloud();
  },
  exportBackup() {
    openModal('ข้อมูลสำรองห้องเรียน (JSON)', `
      <p style="font-size:13px;color:var(--muted);margin-bottom:8px">คัดลอกข้อความด้านล่างเก็บไว้เพื่อใช้กู้คืนข้อมูลได้ตลอดเวลา</p>
      <textarea class="input" style="min-height:200px" readonly>${esc(JSON.stringify(S))}</textarea>
    `);
  },
  importBackup() {
    const inp = $('fileInputJson');
    inp.value = '';
    inp.click();
  }
};

/* ---------- Event Listeners ---------- */
document.addEventListener('click', e => {
  if (e.target === $('modalBackdrop')) {
    closeModal();
    return;
  }
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const fn = ACT[btn.dataset.act];
  if (fn) {
    e.preventDefault();
    fn(btn, e);
  }
});

document.addEventListener('change', e => {
  if (e.target && e.target.id === 'attDateInput') {
    attDate = e.target.value || todayKey();
    render();
  }
});

document.addEventListener('input', e => {
  if (e.target && e.target.id === 'stuSearchInput') {
    const pos = e.target.selectionStart;
    searchQ = e.target.value;
    render();
    const next = $('stuSearchInput');
    if (next) {
      next.focus();
      try { next.setSelectionRange(pos, pos); } catch (_) {}
    }
  }
});

/* Initialize */
render();
loadCloud();
</script>
</body>
</html>
