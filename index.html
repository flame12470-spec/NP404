<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบเมนูหลายหน้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0c0c;
    --panel:#151515;
    --panel-2:#1c1c1c;
    --line:#2a2a2a;
    --text:#f2f2f2;
    --muted:#9a9a9a;
    --accent:#54a8fc;
    --accent-dim:#1c3a56;
    --danger:#e05a5a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:"Prompt",sans-serif;
    background:
      radial-gradient(circle at 15% 10%, #161616 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #141414 0%, transparent 40%),
      var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    min-height:100%;
  }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:rgba(12,12,12,.9);
    backdrop-filter:blur(6px);
    z-index:50;
  }
  .brand{font-size:17px;font-weight:600;letter-spacing:.2px;}
  .brand span{color:var(--accent);}
  .auth-box{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
  .auth-box b{color:var(--text);font-weight:500;}
  .pill-btn{
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    font-family:"Prompt",sans-serif;
    font-size:13px;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:.15s ease;
  }
  .pill-btn:hover{border-color:var(--accent);color:var(--accent);}
  .pill-btn.solid{background:var(--accent);border-color:var(--accent);color:#08131f;font-weight:600;}
  .pill-btn.solid:hover{filter:brightness(1.08);color:#08131f;}

  /* ---------- content ---------- */
  main{flex:1;padding:26px 18px 110px;max-width:720px;width:100%;margin:0 auto;}
  .page-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 24px;
    min-height:260px;
  }
  .hello-title{font-size:26px;font-weight:600;margin-bottom:8px;}
  .hello-sub{color:var(--muted);font-size:14px;line-height:1.7;}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:40px 0;}

  /* ---------- bottom nav ---------- */
  nav.menu-bar{
    position:fixed;
    left:0;right:0;bottom:0;
    background:rgba(14,14,14,.96);
    border-top:1px solid var(--line);
    display:flex;
    gap:8px;
    padding:10px 12px;
    overflow-x:auto;
    z-index:40;
  }
  nav.menu-bar::-webkit-scrollbar{height:0;}
  .menu-item{
    display:flex;
    align-items:center;
    gap:6px;
    flex:0 0 auto;
    padding:10px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--muted);
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
    transition:.15s ease;
  }
  .menu-item.active{
    background:var(--accent-dim);
    border-color:var(--accent);
    color:var(--accent);
  }
  .menu-item .del-x{
    color:#666;
    font-size:12px;
    padding-left:2px;
  }
  .menu-item .del-x:hover{color:var(--danger);}
  .menu-item.add{
    background:transparent;
    border-style:dashed;
    color:var(--accent);
    font-weight:600;
  }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;justify-content:center;
    z-index:100;
    padding:16px;
  }
  .overlay.show{display:flex;}
  .modal{
    width:100%;max-width:440px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px;
    max-height:88vh;
    overflow-y:auto;
  }
  .modal h3{font-size:17px;font-weight:600;margin-bottom:14px;}
  .field{margin-bottom:14px;text-align:left;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .field input, .field textarea, .field select{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 13px;
    color:var(--text);
    font-family:"Prompt",sans-serif;
    font-size:14px;
  }
  .field textarea{resize:vertical;min-height:110px;font-family:monospace;font-size:12.5px;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:none;border-color:var(--accent);}
  .type-toggle{display:flex;gap:8px;margin-bottom:14px;}
  .type-toggle button{
    flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--muted);font-family:"Prompt",sans-serif;cursor:pointer;font-size:13px;
  }
  .type-toggle button.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
  .modal-actions{display:flex;gap:8px;margin-top:6px;}
  .modal-actions .pill-btn{flex:1;text-align:center;}
  .tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--panel-2);padding:4px;border-radius:999px;}
  .tabs button{
    flex:1;border:none;background:transparent;color:var(--muted);
    font-family:"Prompt",sans-serif;font-size:13px;padding:8px 0;border-radius:999px;cursor:pointer;
  }
  .tabs button.active{background:var(--accent);color:#08131f;font-weight:600;}
  .err-msg{color:var(--danger);font-size:12.5px;margin-top:-6px;margin-bottom:12px;min-height:16px;}

  /* ---------- admin panel ---------- */
  .admin-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);
    margin-bottom:8px;
  }
  .admin-row-info{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .admin-row-info b{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .admin-row-info span{font-size:11.5px;color:var(--muted);}
  .admin-row-actions{display:flex;gap:6px;flex:0 0 auto;}
  .admin-row-actions button{
    border:1px solid var(--line);background:var(--panel);color:var(--text);
    font-family:"Prompt",sans-serif;font-size:12px;padding:6px 10px;border-radius:8px;cursor:pointer;
  }
  .admin-row-actions button.del{color:var(--danger);}
  .admin-empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}
  .admin-add-bar{margin-bottom:14px;}
  .badge-admin{
    background:var(--accent-dim);color:var(--accent);font-size:11px;padding:3px 9px;
    border-radius:999px;border:1px solid var(--accent);
  }
</style>
</head>
<body>

<header>
  <div class="brand">เมนู<span>ระบบ</span></div>
  <div class="auth-box" id="authBox">
    <span>กำลังโหลด...</span>
  </div>
</header>

<main>
  <div class="page-card" id="pageContent"></div>
</main>

<nav class="menu-bar" id="menuBar"></nav>

<!-- Add / Edit page modal -->
<div class="overlay" id="pageModal">
  <div class="modal">
    <h3 id="pageModalTitle">เพิ่มหน้าใหม่</h3>
    <div class="field">
      <label>ชื่อเมนู</label>
      <input type="text" id="pageNameInput" placeholder="เช่น ติดต่อเรา">
    </div>
    <div class="type-toggle">
      <button type="button" id="typeCodeBtn" class="active" onclick="setPageType('code')">ใส่โค้ด/เนื้อหา</button>
      <button type="button" id="typeLinkBtn" onclick="setPageType('link')">ลิงก์ภายนอก</button>
    </div>
    <div class="field" id="codeField">
      <label>โค้ด HTML ของหน้านี้</label>
      <textarea id="pageCodeInput" placeholder="&lt;h2&gt;สวัสดีครับ&lt;/h2&gt;&lt;p&gt;เนื้อหาหน้านี้...&lt;/p&gt;"></textarea>
    </div>
    <div class="field" id="linkField" style="display:none;">
      <label>URL ปลายทาง</label>
      <input type="url" id="pageLinkInput" placeholder="https://example.com">
    </div>
    <div class="modal-actions">
      <button class="pill-btn" onclick="closeOverlay('pageModal')">ยกเลิก</button>
      <button class="pill-btn solid" onclick="savePage()">บันทึก</button>
    </div>
  </div>
</div>

<!-- Admin panel modal -->
<div class="overlay" id="adminPanelModal">
  <div class="modal" style="max-width:520px;">
    <h3>แผงควบคุมแอดมิน <span class="badge-admin">Admin</span></h3>
    <div class="admin-add-bar">
      <button class="pill-btn solid" style="width:100%;" onclick="openPageModal()">+ เพิ่มหน้าใหม่</button>
    </div>
    <div id="adminPageList"></div>
    <div class="modal-actions" style="margin-top:10px;">
      <button class="pill-btn" style="flex:1;" onclick="closeOverlay('adminPanelModal')">ปิด</button>
    </div>
  </div>
</div>

<!-- Auth modal -->
<div class="overlay" id="authModal">
  <div class="modal">
    <div class="tabs">
      <button type="button" id="tabLogin" class="active" onclick="setAuthTab('login')">เข้าสู่ระบบ</button>
      <button type="button" id="tabRegister" onclick="setAuthTab('register')">สมัครสมาชิก</button>
    </div>
    <div class="field">
      <label>อีเมล</label>
      <input type="email" id="authEmail" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>รหัสผ่าน</label>
      <input type="password" id="authPassword" placeholder="อย่างน้อย 6 ตัวอักษร">
    </div>
    <div class="err-msg" id="authErr"></div>
    <div class="modal-actions">
      <button class="pill-btn" onclick="closeOverlay('authModal')">ยกเลิก</button>
      <button class="pill-btn solid" id="authSubmitBtn" onclick="submitAuth()">เข้าสู่ระบบ</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import {
    getAuth, onAuthStateChanged,
    signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyACRixuNmOefWk2vDCgmt0K0-6Kvi1V8C0",
    authDomain: "np-404.firebaseapp.com",
    projectId: "np-404",
    storageBucket: "np-404.firebasestorage.app",
    messagingSenderId: "535227695851",
    appId: "1:535227695851:web:12d01c1780c1ec1b0674ae",
    measurementId: "G-SCP8RDBDS8"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  window.__auth = auth;
  window.__authFns = { signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut };

  const authBox = document.getElementById('authBox');
  const ADMIN_EMAIL = 'admin@np404.com';
  window.__ADMIN_EMAIL = ADMIN_EMAIL;

  onAuthStateChanged(auth, (user) => {
    window.__currentUser = user;
    window.__isAdmin = !!(user && user.email && user.email.toLowerCase() === ADMIN_EMAIL);

    if (user) {
      const adminBtn = window.__isAdmin
        ? `<button class="pill-btn solid" onclick="openAdminPanel()">แผงแอดมิน</button>`
        : '';
      authBox.innerHTML = `<b>${user.email}</b>${adminBtn}<button class="pill-btn" onclick="doLogout()">ออกจากระบบ</button>`;
    } else {
      authBox.innerHTML = `<span>ยังไม่ได้เข้าสู่ระบบ</span><button class="pill-btn solid" onclick="openAuthModal()">เข้าสู่ระบบ</button>`;
    }
    if (typeof window.renderMenu === 'function') window.renderMenu();
    if (typeof window.renderActivePage === 'function') window.renderActivePage();
  });

  window.doLogout = function () {
    window.__authFns.signOut(window.__auth);
  };
</script>

<script>
  /* ===================== data layer (Google Apps Script backend) ===================== */
  // TODO: วาง URL ของ Apps Script Web App ที่ deploy แล้วตรงนี้ (ลงท้ายด้วย /exec)
  const API_URL = 'https://script.google.com/macros/s/AKfycbwNzOPeq1ySwZET-yNLabubjiGx-BsLjTpuWuV6cz0AG1MEBkggvSEh6bCnHq5lH7WB/exec';
  const HOME_ID = 'home';

  function apiGet(action) {
    return fetch(`${API_URL}?action=${action}`).then(r => r.json());
  }
  function apiPost(data) {
    return fetch(API_URL, { method: 'POST', body: JSON.stringify(data) }).then(r => r.json());
  }

  let pages = [];
  let activeId = HOME_ID;

  async function fetchPages() {
    const container = document.getElementById('pageContent');
    try {
      pages = await apiGet('getPages');
    } catch (e) {
      console.error(e);
      pages = [];
    }
    renderMenu();
    renderAdminList();
    renderActivePage();
  }

  /* ===================== menu rendering (view-only for everyone) ===================== */
  function renderMenu() {
    const bar = document.getElementById('menuBar');
    bar.innerHTML = '';

    bar.appendChild(makeMenuItem({ id: HOME_ID, name: 'สวัสดี' }));
    pages.forEach(p => bar.appendChild(makeMenuItem(p)));
  }
  window.renderMenu = renderMenu;

  function makeMenuItem(p) {
    const el = document.createElement('div');
    const key = p.id || p.rowIndex;
    el.className = 'menu-item' + (key === activeId ? ' active' : '');
    el.innerText = p.name;

    el.onclick = () => {
      if (p.type === 'link') {
        window.open(p.content, '_blank');
      } else {
        activeId = key;
        renderMenu();
        renderActivePage();
      }
    };
    return el;
  }

  async function deletePage(rowIndex) {
    if (!window.__isAdmin) return;
    if (!confirm('ต้องการลบเมนูนี้ใช่หรือไม่?')) return;
    try {
      await apiPost({ action: 'deletePage', rowIndex });
    } catch (e) {
      alert('ลบไม่สำเร็จ กรุณาลองใหม่');
      return;
    }
    if (activeId === rowIndex) activeId = HOME_ID;
    await fetchPages();
  }
  window.deletePage = deletePage;

  /* ===================== page content rendering ===================== */
  function renderActivePage() {
    const container = document.getElementById('pageContent');
    if (activeId === HOME_ID) {
      const user = window.__currentUser;
      const who = user ? `ยินดีต้อนรับ, ${user.email}` : 'คุณยังไม่ได้เข้าสู่ระบบ';
      container.innerHTML = `
        <div class="hello-title">สวัสดี 👋</div>
        <div class="hello-sub">${who}<br>นี่คือหน้าหลักสำหรับผู้ใช้ทั่วไป เลือกดูเมนูอื่น ๆ ได้จากแถบด้านล่าง</div>
      `;
      return;
    }

    const p = pages.find(p => (p.id || p.rowIndex) === activeId);
    if (!p) { container.innerHTML = '<div class="empty">ไม่พบหน้านี้ หรือกำลังโหลดข้อมูล...</div>'; return; }

    if (p.type === 'code') {
      container.innerHTML = '';
      const wrapper = document.createElement('div');
      wrapper.innerHTML = p.content;
      // move nodes over, re-creating <script> tags so they actually execute
      Array.from(wrapper.childNodes).forEach(node => {
        if (node.tagName === 'SCRIPT') {
          const s = document.createElement('script');
          if (node.src) s.src = node.src;
          s.text = node.textContent;
          container.appendChild(s);
        } else {
          container.appendChild(node);
        }
      });
    }
  }
  window.renderActivePage = renderActivePage;

  /* ===================== admin panel ===================== */
  function openAdminPanel() {
    if (!window.__isAdmin) return;
    renderAdminList();
    document.getElementById('adminPanelModal').classList.add('show');
  }
  window.openAdminPanel = openAdminPanel;

  function renderAdminList() {
    const list = document.getElementById('adminPageList');
    list.innerHTML = '';

    if (pages.length === 0) {
      list.innerHTML = '<div class="admin-empty">ยังไม่มีหน้าที่สร้างเพิ่ม นอกจากหน้า "สวัสดี"</div>';
      return;
    }

    pages.forEach(p => {
      const row = document.createElement('div');
      row.className = 'admin-row';
      row.innerHTML = `
        <div class="admin-row-info">
          <b>${p.name}</b>
          <span>${p.type === 'link' ? 'ลิงก์ภายนอก' : 'โค้ด/เนื้อหา'}</span>
        </div>
        <div class="admin-row-actions">
          <button onclick="openPageModal(pages.find(x=>(x.rowIndex)===${p.rowIndex}))">แก้ไข</button>
          <button class="del" onclick="deletePage(${p.rowIndex})">ลบ</button>
        </div>
      `;
      list.appendChild(row);
    });
  }
  window.renderAdminList = renderAdminList;

  /* ===================== add/edit page modal (admin only) ===================== */
  let editingId = null;
  let currentType = 'code';

  function openPageModal(p) {
    if (!window.__isAdmin) { alert('เฉพาะแอดมินเท่านั้นที่แก้ไขเมนูได้'); return; }
    editingId = p ? p.rowIndex : null;
    document.getElementById('pageModalTitle').innerText = p ? 'แก้ไขเมนู' : 'เพิ่มหน้าใหม่';
    document.getElementById('pageNameInput').value = p ? p.name : '';
    document.getElementById('pageCodeInput').value = (p && p.type === 'code') ? p.content : '';
    document.getElementById('pageLinkInput').value = (p && p.type === 'link') ? p.content : '';
    setPageType(p ? p.type : 'code');
    document.getElementById('pageModal').classList.add('show');
  }

  function setPageType(type) {
    currentType = type;
    document.getElementById('typeCodeBtn').classList.toggle('active', type === 'code');
    document.getElementById('typeLinkBtn').classList.toggle('active', type === 'link');
    document.getElementById('codeField').style.display = type === 'code' ? 'block' : 'none';
    document.getElementById('linkField').style.display = type === 'link' ? 'block' : 'none';
  }
  window.setPageType = setPageType;

  async function savePage() {
    if (!window.__isAdmin) { alert('เฉพาะแอดมินเท่านั้นที่แก้ไขเมนูได้'); return; }
    const name = document.getElementById('pageNameInput').value.trim();
    if (!name) { alert('กรุณากรอกชื่อเมนู'); return; }

    const content = currentType === 'code'
      ? document.getElementById('pageCodeInput').value
      : document.getElementById('pageLinkInput').value.trim();

    if (!content) { alert('กรุณากรอกเนื้อหาหรือ URL'); return; }

    const saveBtn = document.querySelector('#pageModal .pill-btn.solid');
    saveBtn.disabled = true;
    saveBtn.innerText = 'กำลังบันทึก...';

    try {
      if (editingId) {
        await apiPost({ action: 'updatePage', rowIndex: editingId, name, type: currentType, content });
      } else {
        await apiPost({ action: 'addPage', name, type: currentType, content });
      }
      closeOverlay('pageModal');
      await fetchPages();
      if (editingId) { activeId = editingId; renderActivePage(); }
    } catch (e) {
      alert('บันทึกไม่สำเร็จ กรุณาลองใหม่ หรือตรวจสอบ URL ของ Apps Script');
    } finally {
      saveBtn.disabled = false;
      saveBtn.innerText = 'บันทึก';
    }
  }
  window.savePage = savePage;
  window.openPageModal = openPageModal;

  /* ===================== auth modal ===================== */
  let authTab = 'login';
  function setAuthTab(tab) {
    authTab = tab;
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
    document.getElementById('authSubmitBtn').innerText = tab === 'login' ? 'เข้าสู่ระบบ' : 'สมัครสมาชิก';
    document.getElementById('authErr').innerText = '';
  }
  window.setAuthTab = setAuthTab;

  window.openAuthModal = function () {
    document.getElementById('authEmail').value = '';
    document.getElementById('authPassword').value = '';
    document.getElementById('authErr').innerText = '';
    setAuthTab('login');
    document.getElementById('authModal').classList.add('show');
  };

  window.submitAuth = function () {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const errBox = document.getElementById('authErr');
    errBox.innerText = '';
    if (!email || !password) { errBox.innerText = 'กรุณากรอกอีเมลและรหัสผ่าน'; return; }

    const fn = authTab === 'login' ? window.__authFns.signInWithEmailAndPassword : window.__authFns.createUserWithEmailAndPassword;
    fn(window.__auth, email, password)
      .then(() => closeOverlay('authModal'))
      .catch(e => { errBox.innerText = translateAuthError(e.code); });
  };

  function translateAuthError(code) {
    const map = {
      'auth/invalid-email': 'อีเมลไม่ถูกต้อง',
      'auth/user-not-found': 'ไม่พบบัญชีนี้',
      'auth/wrong-password': 'รหัสผ่านไม่ถูกต้อง',
      'auth/invalid-credential': 'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
      'auth/email-already-in-use': 'อีเมลนี้ถูกใช้ไปแล้ว',
      'auth/weak-password': 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'
    };
    return map[code] || 'เกิดข้อผิดพลาด กรุณาลองใหม่';
  }

  function closeOverlay(id) {
    document.getElementById(id).classList.remove('show');
  }
  window.closeOverlay = closeOverlay;

  /* ===================== init ===================== */
  renderMenu();
  renderActivePage();
  fetchPages();
</script>
</body>
</html>
