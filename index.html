<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5bd3">
<title>เว็บห้อง ม.4/4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --blue:#0b5bd3;--blue-dark:#0a3f9c;--blue-light:#1e9bff;--yellow:#ffd21f;
  --bg:#f5f7fa;--card:#fff;--text:#1b2330;--muted:#5b6678;--line:#e3e7ee;
  --soft:#eaf2ff;--shadow:0 4px 16px rgba(0,0,0,.07);--radius:20px;
  --red:#ffe1e1;--redInk:#c0221b;--warn:#fff0c2;--warnInk:#8a5a00;--okBg:#dff7e6;--okInk:#17693a;
  --sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Prompt',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;line-height:1.55}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;touch-action:manipulation}
input,select,textarea{font:inherit;font-size:16px;color:var(--text)}
a{color:var(--blue);text-decoration:none}
.hide{display:none!important}
.sub,.mu{color:var(--muted);font-size:13px}
.err{color:var(--redInk)}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:50;background:var(--blue);color:#fff;height:calc(64px + var(--sat));padding:var(--sat) 16px 0;display:flex;align-items:center;justify-content:space-between}
.hdr .ib{background:none;color:#fff;display:grid;place-items:center;width:44px;height:44px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px;color:#fff}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--yellow);color:var(--blue);display:grid;place-items:center;font-weight:800}
.avatar-btn{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:var(--blue-dark);display:grid;place-items:center;color:var(--yellow);font-weight:700;font-size:16px}
.avatar-btn svg{width:24px;height:24px;fill:var(--yellow)}

#view{max-width:1100px;margin:0 auto;padding:0 16px calc(110px + var(--sab));min-height:80dvh}
.pghead{display:flex;align-items:center;gap:12px;padding:22px 0 8px}
.pghead h1{font-size:26px;font-weight:600;flex:1;min-width:0;line-height:1.25}
.topsub{color:var(--muted);font-size:14px;margin-bottom:8px}
.icon-btn{width:42px;height:42px;border-radius:14px;background:#e9eef7;display:grid;place-items:center;font-size:26px;flex:none}

/* ---------- drawer ---------- */
.drawer-bg{position:fixed;inset:0;z-index:90;background:rgba(0,10,40,.5);opacity:0;pointer-events:none;transition:.25s}
.drawer-bg.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(340px,86vw);z-index:95;background:#fff;transform:translateX(-100%);transition:transform .3s;overflow-y:auto;padding-bottom:calc(30px + var(--sab))}
.drawer.show{transform:none}
.drawer-head{height:calc(64px + var(--sat));padding:var(--sat) 16px 0;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0}
.drawer-head .x{color:#fff;font-size:34px;width:44px;height:44px}
.dr-item{border-bottom:1px solid #eef0f4}
.dr-item>button,.dr-link{width:100%;display:flex;justify-content:space-between;align-items:center;padding:18px 20px;font-size:17px;text-align:left;color:var(--text);cursor:pointer}
.dr-item>button svg{width:20px;height:20px;stroke:#9aa3b2;fill:none;stroke-width:2;transition:.2s}
.dr-item.open>button svg{transform:rotate(180deg)}
.dr-sub{display:none;background:var(--bg);padding:6px 0}
.dr-item.open .dr-sub{display:block}
.dr-sub a{display:block;padding:12px 32px;color:var(--muted);font-size:16px}
.dr-sub a:hover,.dr-sub a.on{color:var(--blue);font-weight:600}

/* ---------- hero ---------- */
.hero{margin-top:16px;border-radius:var(--radius);overflow:hidden;background:linear-gradient(120deg,#0a4fc4,#1e9bff);color:#fff;box-shadow:var(--shadow)}
.slides{display:flex;transition:transform .5s ease}
.slide{min-width:100%;padding:34px 26px;display:grid;grid-template-columns:1.3fr .7fr;gap:16px;align-items:center}
.slide h1{font-size:clamp(26px,5vw,48px);font-weight:800;color:var(--yellow);text-shadow:0 3px 10px rgba(0,0,0,.25);line-height:1.15;overflow-wrap:anywhere}
.slide .s{font-size:16px;margin:8px 0 2px;opacity:.95}
.slide .b{font-size:clamp(16px,2.6vw,22px);font-weight:600;margin-bottom:16px;overflow-wrap:anywhere}
.btn-pill{display:inline-flex;align-items:center;gap:12px;background:#0a4fc4;border:2px solid #7fb8ff;color:#fff;font-size:17px;font-weight:600;padding:6px 6px 6px 22px;border-radius:99px}
.btn-pill span{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font-size:14px}
.hero-art{font-size:clamp(70px,14vw,130px);text-align:center;opacity:.95}
.dots{display:flex;justify-content:center;gap:8px;padding:12px;background:#fff}
.dots i{width:10px;height:10px;border-radius:50%;background:#d3d8e0;cursor:pointer}
.dots i.on{width:56px;border-radius:6px;background:#3d8bff}

/* ---------- headings ---------- */
h2.title{text-align:center;font-size:26px;font-weight:600;margin:34px 0 18px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 6px}
.section-title h3{font-size:19px}

/* ---------- tiles ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:6px 0 10px}
.tile{background:#f7f8fa;border-radius:var(--radius);padding:16px 6px 12px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:116px;position:relative;transition:.15s}
.tile:active{transform:scale(.96)}
.tile:hover{transform:translateY(-3px)}
.tile .emo{font-size:36px;line-height:1;width:56px;height:56px;display:grid;place-items:center}
.tile .emo svg{width:32px;height:32px}
.tile .t{font-size:14px;line-height:1.3;color:var(--blue);word-break:break-word}
.tag-new{position:absolute;top:-6px;right:-3px;background:#7b5cff;color:#fff;font-size:12px;padding:2px 12px;border-radius:99px;font-weight:600}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin:12px 0;padding:18px;position:relative}
.card .t{font-size:17px;font-weight:600;margin-bottom:2px;overflow-wrap:anywhere}
.card p{font-size:14px;overflow-wrap:anywhere}
.card.pinned{border:2px solid var(--yellow)}
.cards-grid{display:grid;grid-template-columns:1fr;gap:0 16px}
.cols3{display:grid;grid-template-columns:1fr;gap:0 16px}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:2px 12px;white-space:nowrap;font-weight:500;background:var(--soft);color:var(--blue)}
.tag.ok{background:var(--okBg);color:var(--okInk)}.tag.part{background:var(--warn);color:var(--warnInk)}.tag.no{background:var(--red);color:var(--redInk)}
.list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:4px 18px;margin:10px 0}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-bottom:1px dashed var(--line);text-align:left}
.item:last-child{border:0}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0}
.chip2{border-radius:16px;padding:12px 14px;background:#fff;box-shadow:var(--shadow);text-align:left}
.chip2 small{display:block;font-size:12px;color:var(--muted)}
.chip2 b{font-size:20px;font-weight:700;display:block}
.chip2.hl{background:linear-gradient(120deg,var(--soft),#bcd8ff)}
.in{color:#2e7d32}.out{color:#c62828}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty b{color:var(--text);display:block}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.profile-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin:14px 0;padding:16px;display:flex;align-items:center;gap:14px}
.avatar{width:56px;height:56px;border-radius:50%;border:2px solid var(--blue);background:var(--soft);display:grid;place-items:center;font-weight:700;color:var(--blue);font-size:20px;flex:none}
.profile-card .info{flex:1;min-width:0}
.profile-card .name{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.promo-strip{width:100%;background:linear-gradient(90deg,#e8f1ff,#6fb0ff);border-radius:var(--radius);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;text-align:left;gap:10px;margin:12px 0}
.promo-strip div{min-width:0}.promo-strip b{font-size:17px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.promo-strip small{font-size:13px}.promo-strip span{font-size:28px}
.notice{background:#fbf6d0;border-radius:16px;padding:14px 46px 14px 18px;display:flex;gap:12px;align-items:flex-start;position:relative;margin-top:16px}
.notice h4{font-size:16px}.notice p{font-size:14px}
.notice .close{position:absolute;right:12px;top:8px;font-size:28px;color:#8a6d00}

/* ---------- FAQ / CTA / footer ---------- */
.faq{display:grid;gap:14px;max-width:900px;margin:0 auto}
.faq-item{background:#f1f6ff;border-radius:20px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;padding:20px 24px;font-size:17px;text-align:left}
.faq-q svg{width:22px;height:22px;stroke:#111;fill:none;stroke-width:3;transition:.25s;flex:none}
.faq-item:not(.open) .faq-q svg{transform:rotate(180deg)}
.faq-a{padding:0 24px 20px;color:var(--muted);font-size:15px}
.faq-item:not(.open) .faq-a{display:none}
.cta-sec{background:#f1f6ff;border-radius:var(--radius);text-align:center;padding:40px 20px;margin-top:34px}
.cta-sec h2{font-size:28px;font-weight:700}.cta-sec p{font-size:16px;margin:8px 0 20px;color:var(--muted)}
.foot{margin:30px -16px 0;background:linear-gradient(180deg,#6aa2ee,#0a4fc4);color:#fff;text-align:center;padding:30px 20px calc(30px + var(--sab));font-size:15px}
.foot b{font-size:20px;display:block;margin-bottom:6px}

/* ---------- forms / buttons ---------- */
label{font-size:14px;color:var(--muted);display:block;margin:14px 0 6px}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;padding:13px 18px;border-radius:99px;border:2px solid var(--line);background:#fff;outline:none;-webkit-appearance:none;appearance:none;min-height:52px}
input[type=file]{width:100%;padding:12px;border:2px dashed var(--line);border-radius:18px;background:#fff}
input[type=checkbox]{width:26px;height:26px;accent-color:var(--blue)}
select{background-image:linear-gradient(45deg,transparent 50%,#777 50%),linear-gradient(135deg,#777 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
textarea{border-radius:20px;resize:none;min-height:96px;line-height:1.7}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #bcd3f7}
.search{margin:8px 0 4px}
.cta{display:block;width:100%;margin:14px 0;padding:16px;border-radius:16px;background:var(--blue);color:#fff;font-size:18px;font-weight:600;text-align:center;transition:.15s}
.cta:hover{background:var(--blue-dark)}
.cta:active,.btn:active{transform:scale(.97)}
.cta.inline{margin:20px 0 0}
.cta.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.cta.y{background:var(--yellow);color:#1b2330}
.btn{padding:10px 18px;border-radius:99px;font-size:14px;background:#fff;border:2px solid var(--line);white-space:nowrap}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.sm{padding:6px 14px;font-size:13px}
.btn.r{color:var(--redInk);border-color:#f3c6c6}
.btn:disabled{opacity:.5}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:14px 0;line-height:1.7}
.row2{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.row2>select{width:140px}.row2>input{flex:1;min-width:140px}
.err-line{color:var(--redInk);font-size:14px;text-align:center;min-height:20px;margin-top:8px}

/* ---------- modal / toast / floating ---------- */
#sheetBg{position:fixed;inset:0;background:rgba(0,10,40,.55);backdrop-filter:blur(5px);z-index:100;opacity:0;pointer-events:none;transition:.2s}
#sheetBg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;top:50%;width:min(600px,92vw);max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch;background:#fff;border-radius:28px;z-index:101;padding:32px 26px 28px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:.22s}
#sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
#sheet h2{font-size:24px;font-weight:700;color:var(--blue-dark);margin-bottom:6px;padding-right:44px}
#sheet .x{position:absolute;top:18px;right:18px;width:40px;height:40px;font-size:32px;color:#444}
#sheet .grid{padding:8px 0 0}
#toast{position:fixed;left:50%;bottom:calc(30px + var(--sab));transform:translate(-50%,20px);background:#222;color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0);opacity:1}
.fab{position:fixed;right:18px;z-index:40;border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.fab-top{bottom:calc(20px + var(--sab));width:56px;height:56px;background:#fff;display:grid;place-items:center}
.fab-top svg{width:26px;height:26px;stroke:var(--blue);stroke-width:3;fill:none}
.fab-chat{bottom:calc(88px + var(--sab));width:60px;height:60px;background:var(--yellow);display:grid;place-items:center;font-size:28px}
.fade{animation:fade .35s}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media print{.hdr,.fab,.cta,.search,.acts,.drawer{display:none!important}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(min-width:700px){
  .grid{grid-template-columns:repeat(4,1fr)}
  .cards-grid{grid-template-columns:1fr 1fr}
  .cols3{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:1000px){
  .grid{grid-template-columns:repeat(6,1fr);gap:16px}
  .cards-grid{grid-template-columns:repeat(3,1fr)}
  #sheet .grid{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:620px){.slide{grid-template-columns:1fr}.hero-art{display:none}}
</style>
</head>
<body>

<header class="hdr">
  <button class="ib" data-act="openMenu" aria-label="เมนู"><svg width="30" height="30" viewBox="0 0 24 24" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"><path d="M3 7h18M3 12h12M3 17h7"/></svg></button>
  <a class="logo" href="#" data-act="go" data-v="home"><span class="logo-mark">ม</span>ห้อง ม.4/4</a>
  <button class="avatar-btn" id="avatarBtn" data-act="avatar" aria-label="บัญชี"></button>
</header>

<div class="drawer-bg" id="drawerBg" data-act="closeMenu"></div>
<nav class="drawer" id="drawer" aria-label="เมนูหลัก">
  <div class="drawer-head"><a class="logo" href="#" data-act="go" data-v="home"><span class="logo-mark">ม</span>ห้อง ม.4/4</a><button class="x" data-act="closeMenu" aria-label="ปิดเมนู">×</button></div>
  <div id="drawerBody"></div>
</nav>

<main id="view"><div class="card" style="text-align:center"><p class="sub">กำลังโหลด...</p></div></main>

<button class="fab fab-chat" data-act="go" data-v="chat" aria-label="แชตห้องเรียน">💬</button>
<button class="fab fab-top" data-act="top" aria-label="กลับขึ้นบน"><svg viewBox="0 0 24 24"><path d="M12 20V5M5 12l7-7 7 7"/></svg></button>

<div id="sheetBg" data-act="closeSheet"></div><div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
// ====== ตั้งค่า Supabase (ใช้ค่าเดิมของระบบเก่า) ======
const SB_URL='https://iejmwihipfvtkbvjtude.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imllam13aWhpcGZ2dGtidmp0dWRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NzQ0MzksImV4cCI6MjEwNjI1MDQzOX0.jR6txR7ztk_iKiF6-oxjkilpVllajLN3koIPNA5uBUY';
const db=(window.supabase&&typeof window.supabase.createClient==='function')?window.supabase.createClient(SB_URL,SB_KEY):null;

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const TH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const fd=k=>{if(!k)return '';const p=String(k).split('-');if(p.length<3||!TH[+p[1]-1])return String(k);return (+p[2])+' '+TH[+p[1]-1]+' '+((+p[0]+543)%100)};
const st=v=>/^(อนุมัติ|แก้ไขแล้ว|คืนแล้ว|เปิด)$/.test(v)?'ok':v==='ไม่อนุมัติ'?'no':'part';
const DAYS='จันทร์,อังคาร,พุธ,พฤหัสบดี,ศุกร์'.split(',');
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)};
const openSheet=h=>{$('#sheet').innerHTML='<button class="x" data-act="closeSheet" aria-label="ปิด">×</button>'+h;$('#sheet').classList.add('on');$('#sheetBg').classList.add('on');$('#sheet').scrollTop=0;const f=$('#sheet input:not([type=file]),#sheet textarea');if(f)setTimeout(()=>f.focus(),120)};
const closeSheet=()=>{$('#sheet').classList.remove('on');$('#sheetBg').classList.remove('on')};
const setMenu=o=>{$('#drawer').classList.toggle('show',o);$('#drawerBg').classList.toggle('show',o);document.body.style.overflow=o?'hidden':''};

// ====== เมนู: key:[ชื่อ, ไอคอน, ฟิลด์[ชื่อ,ป้าย,ชนิด,'a'=เฉพาะผู้ดูแล], 'u'=นักเรียนเพิ่มเองได้] ======
const M={
 home:['หน้าหลัก','🏠'],
 schedule:['ตารางเรียน','🗓️',[['day','วัน','sel:'+DAYS],['time','เวลา'],['subject','รายวิชา'],['teacher','ครูผู้สอน'],['room','ห้องเรียน']]],
 attendance:['เช็กชื่อ','✅',[['name','ชื่อนักเรียน'],['date','วันที่','date'],['status','สถานะ','sel:มา,ขาด,ลา,สาย']]],
 money:['เงินห้อง','💰',[['title','รายการ'],['type','ประเภท','sel:รายรับ,รายจ่าย'],['amount','จำนวนเงิน (บาท)','num'],['date','วันที่','date'],['who','ผู้จ่าย/หมายเหตุ']]],
 homework:['การบ้าน','📚',[['subject','รายวิชา'],['task','งานที่สั่ง'],['due','กำหนดส่ง','date'],['detail','รายละเอียด','ta']]],

async function login(){
 let id=$('#ae').value.trim();const pw=$('#ap').value;
 if(!id||!pw)return toast('กรอกอีเมลและรหัสผ่านก่อน');
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(id)){
  // รองรับชื่อ-สกุลแบบระบบเดิม
  const r=await db.rpc('login_email',{u:id});if(r.error)return toast(em(r.error));if(!r.data)return toast('รูปแบบอีเมลไม่ถูกต้อง');id=r.data;
 }
 const r2=await db.auth.signInWithPassword({email:id,password:pw});
 if(r2.error)return toast('เข้าสู่ระบบไม่สำเร็จ: '+em(r2.error));
 closeSheet();boot();
}
async function signup(){
 const n=$('#an').value.trim(),e=$('#ae').value.trim();
 if(!n)return toast('กรอกชื่อ-สกุลก่อนสมัคร');
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e))return toast('รูปแบบอีเมลไม่ถูกต้อง');
 const t=await db.rpc('name_taken',{n:n});if(t.error)return toast(em(t.error));if(t.data)return toast('ชื่อนี้มีคนใช้แล้ว เพิ่มนามสกุลหรือเลขท้ายให้ต่างกัน');
 const r=await db.auth.signUp({email:e,password:$('#ap').value,options:{data:{name:n}}});
 if(r.error)return toast(em(r.error));
 if(r.data.session){closeSheet();boot()}else toast('สมัครแล้ว กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ');
}
async function logout(){await db.auth.signOut();if(ch)db.removeChannel(ch);location.reload()}

async function boot(){
 const v=$('#view');
 if(!db){v.innerHTML='<div class="card"><p class="err">โหลดไลบรารี Supabase ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้านี้</p></div>';return}
 try{
  const s=await db.auth.getSession(),session=s.data&&s.data.session;
  if(session){
   const p=await db.from('profiles').select('*').eq('id',session.user.id).single();
   ME=p.data||{id:session.user.id,email:session.user.email,name:session.user.email,role:'student',perms:[]};
  }else ME={role:'guest',name:'ผู้เยี่ยมชม',perms:[]};
  LOCK=((await db.from('locked_modules').select('module')).data||[]).map(x=>x.module);
  if(ch)db.removeChannel(ch);
  ch=db.channel('rt').on('postgres_changes',{event:'*',schema:'public',table:'items'},function(p){
   const n=p.new||{};
   if(p.eventType==='INSERT'&&(n.module==='announce'||n.module==='homework'))toast('🔔 มี'+M[n.module][0]+'ใหม่');
   if(!n.module||n.module===cur){
    const a=document.activeElement;
    if(!$('#sheet').classList.contains('on')&&!(a&&a.id==='qs'))show(cur,1);
   }
  }).subscribe();
  if(!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(SB_URL))toast('SB_URL ไม่ถูกต้อง ต้องหน้าตาแบบ https://xxxx.supabase.co');
  drawHeader();stack=[];show('home');
 }catch(e){v.innerHTML='<div class="card"><p class="err">'+esc(em(e))+'</p></div>'}
}

async function show(m,silent){
 cur=m;if(!silent){Q='';scrollTo(0,0)}clearInterval(HT);drawNav();
 const v=$('#view');
 if(!silent)v.innerHTML=head(esc(title(m)),{back:m!=='home'})+'<p class="hint">กำลังโหลด...</p>';
 try{
  if(isG()&&(LOCK.includes(m)||ADMIN_ONLY.includes(m)))return gate(v,m);
  if(ADMIN_ONLY.includes(m)&&!isA())throw Error('เฉพาะผู้ดูแล');
  await (SP[m]||list)(m,v);
 }catch(e){v.innerHTML=head(esc(title(m)),{back:m!=='home'})+'<div class="card"><p class="err">'+esc(em(e))+'</p></div>'}
}

// ====== รายการทั่วไป ======
const q=m=>db.from('items').select('*').eq('module',m).is('deleted_at',null).order('created_at',{ascending:false}).limit(500);
async function list(m,v){
 let r=await q(m);if(r.error)throw r.error;let data=r.data||[];
 if(m==='announce'){if(!canEdit(m))data=data.filter(x=>!x.data.date||x.data.date<=today());data.sort((a,b)=>(b.data.pin==='ปัก')-(a.data.pin==='ปัก'))}
 if(m==='poll')VOTES=(await q('vote')).data||[];
 ROWS=data;const t=M[m][0],ic=M[m][1],w=M[m][3],add=canEdit(m)||w==='u';
 v.innerHTML=head(ic+' '+t,{back:1})+(add?'<button class="cta" data-act="openForm" data-m="'+m+'">+ เพิ่ม'+(m==='chat'?'ข้อความ':'')+'</button>':'')+
  (m==='money'?sum(data):'')+'<input type="text" class="search" id="qs" placeholder="ค้นหา..." value="'+esc(Q)+'" autocomplete="off"><div id="ls" class="cards-grid"></div>';
 paint(m);
}
function sum(d){let i=0,o=0;d.forEach(x=>x.data.type==='รายจ่าย'?o+=+x.data.amount||0:i+=+x.data.amount||0);
 return '<div class="sum3"><div class="chip2"><small>รายรับ</small><b class="in">'+i.toLocaleString()+'</b></div><div class="chip2"><small>รายจ่าย</small><b class="out">'+o.toLocaleString()+'</b></div><div class="chip2 hl"><small>คงเหลือ</small><b>'+(i-o).toLocaleString()+'</b></div></div>'}
function paint(m){const s=Q.toLowerCase(),r=ROWS.filter(x=>!s||JSON.stringify(x.data).toLowerCase().includes(s));
 $('#ls').innerHTML=r.length?r.map(x=>card(m,x)).join(''):'<div class="card empty" style="grid-column:1/-1"><b>ยังไม่มีข้อมูล</b>'+(canEdit(m)||M[m][3]==='u'?'กด “+ เพิ่ม” เพื่อเริ่มต้น':'')+'</div>'}
const safeUrl=u=>/^https?:\/\//i.test(String(u||''));
function card(m,r){
 const F=M[m][2],d=r.data||{},ed=canEdit(m);let h;
 if(m==='chat'){h='<div class="card fade"><p>'+esc(d.msg)+'</p><p class="mu">'+new Date(r.created_at).toLocaleString('th-TH')+'</p>'}
 else{
  h='<div class="card fade'+(d.pin==='ปัก'?' pinned':'')+'"><div class="t">'+(d.pin==='ปัก'?'📌 ':'')+esc(d[F[0][0]])+'</div>';
  F.slice(1).forEach(function(f){
   const k=f[0],l=f[1],t=f[2];let v=d[k];if(k==='status'&&!v)v='รออนุมัติ';if(!v||k==='pin')return;
   let val;
   if(t==='file')val=safeUrl(v)?'<a href="'+esc(v)+'" target="_blank" rel="noopener">เปิดไฟล์</a>':esc(v);
   else if(k==='status')val='<span class="tag '+st(v)+'">'+esc(v)+'</span>';
   else if(t==='date')val=esc(fd(v));
   else val=esc(v);
   h+='<p><span class="mu">'+l+':</span> '+val+'</p>';
  });
 }
 if(m==='poll'){
  const o=(d.opts||'').split(',').map(s=>s.trim()).filter(Boolean),vs=VOTES.filter(x=>x.data.poll===r.id),mine=ME&&vs.some(x=>x.created_by===ME.id);
  h+='<div class="acts">'+o.map(c=>'<button class="btn sm" '+(d.status==='ปิด'||mine?'disabled':'')+' data-act="vote" data-poll="'+esc(r.id)+'" data-c="'+esc(c)+'">'+esc(c)+' · '+vs.filter(x=>x.data.choice===c).length+'</button>').join('')+'</div>';
 }
 if(ed)h+='<div class="acts"><button class="btn sm" data-act="openForm" data-m="'+m+'" data-id="'+esc(r.id)+'">แก้ไข</button><button class="btn sm r" data-act="del" data-id="'+esc(r.id)+'">ลบ</button></div>';
 return h+'</div>';
}
async function vote(poll,choice){
 if(isG())return authChoice();
 const r=await db.from('items').insert({module:'vote',data:{poll:poll,choice:choice},created_by:ME.id});
 toast(r.error?'โหวตไม่สำเร็จ (อาจโหวตไปแล้ว)':'โหวตแล้ว');show('poll',1);
}

// ====== ฟอร์ม ======
function inp(k,t,v){t=t||'';v=esc(v==null?'':v);
 if(t==='ta')return '<textarea id="f_'+k+'">'+v+'</textarea>';
 if(t.startsWith('sel:'))return '<select id="f_'+k+'">'+t.slice(4).split(',').map(o=>'<option '+(o===v?'selected':'')+'>'+o+'</option>').join('')+'</select>';
 const ty={date:'date',num:'number',file:'file'}[t]||'text';
 return '<input id="f_'+k+'" type="'+ty+'" '+(t==='file'?'':'value="'+v+'"')+' autocomplete="off">';
}
function openForm(m,id){
 if(isG())return authChoice();
 const r=ROWS.find(x=>x.id===id),d=(r&&r.data)||{},F=M[m][2].filter(f=>f[3]!=='a'||canEdit(m));
 openSheet('<h2>'+(r?'แก้ไข':'เพิ่ม')+' '+M[m][0]+'</h2>'+F.map(f=>'<label>'+f[1]+'</label>'+inp(f[0],f[2],d[f[0]])).join('')+'<button class="cta inline" data-act="save" data-m="'+m+'" data-id="'+esc(id||'')+'">บันทึก</button>');

async function save(m,id){
 const old=ROWS.find(x=>x.id===id),d=Object.assign({},(old&&old.data)||{});
 for(const f of M[m][2]){
  const k=f[0],t=f[2],e=$('#f_'+k);if(!e)continue;
  if(t==='file'){
   const file=e.files[0];
   if(file){
    const p=ME.id+'/'+Date.now()+'-'+file.name.replace(/[^\w.-]/g,'_');
    const u=await db.storage.from('files').upload(p,file);
    if(u.error)return toast('อัปโหลดไม่สำเร็จ: '+u.error.message);
    d[k]=db.storage.from('files').getPublicUrl(p).data.publicUrl;
   }
  }else d[k]=e.value.trim();
 }
 if(!String(d[M[m][2][0][0]]||'').trim())return toast('กรอก “'+M[m][2][0][1]+'” ก่อนบันทึก');
 const r=await (id?db.from('items').update({data:d}).eq('id',id):db.from('items').insert({module:m,data:d,created_by:ME.id}));
 if(r.error)return toast(r.error.message);
 closeSheet();toast('บันทึกแล้ว');show(m,1);
}

function dl(n,t,s){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function csv(k){
 const r=await q(k),F=M[k][2],c=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
 dl(k+'-'+today()+'.csv','text/csv;charset=utf-8','﻿'+[F.map(f=>c(f[1]))].concat((r.data||[]).map(row=>F.map(f=>c(row.data[f[0]])))).map(x=>x.join(',')).join('\r\n'));
}
