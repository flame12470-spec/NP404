<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NP-404 System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* =========================================================
   NP-404 — reskinned to match the "minaPM" reference layout:
   white sticky navbar, pink accent, horizontal top tabs,
   hero banner on home, boxed white cards for content.
   ========================================================= */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#fafafa;
  --line:#eef0f2; --ink:#333333; --muted:#888888;
  --accent:#e91e63; --accent-ink:#ffffff; --accent-soft:#fce4ec; --accent-dark:#c2185b;
  --ok:#28a745; --danger:#dc3545;
  --radius:14px; --radius-sm:10px;
  --shadow:0 2px 10px rgba(0,0,0,.05);
  --shadow-lg:0 10px 30px rgba(0,0,0,.12);
}
[data-theme="dark"]{
  --bg:#15161a; --surface:#1e2025; --surface-2:#25272d;
  --line:#2e3038; --ink:#f1f1f1; --muted:#9a9a9a;
  --accent:#ff5c8a; --accent-ink:#1a1a1a; --accent-soft:rgba(255,92,138,.15); --accent-dark:#ff85a8;
  --ok:#3fcf9f; --danger:#ff7a7a;
  --shadow:0 2px 10px rgba(0,0,0,.3); --shadow-lg:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;overflow-x:hidden}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font-family:Kanit,sans-serif;padding-bottom:30px;transition:background .2s,color .2s}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
img,video,iframe{max-width:100%;height:auto}
.hidden{display:none!important}

/* ---------- Header / navbar ---------- */
header{position:sticky;top:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:10px 16px;background:var(--surface);box-shadow:var(--shadow)}
.brand-wrap{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:linear-gradient(135deg,#ff80ab,#e91e63)}
.brand{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--accent)}
.auth-box{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;flex-shrink:0}
.user-name{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:500;
  background:var(--accent-soft);color:var(--accent-dark);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600}
.theme-btn{width:32px;height:32px;flex:0 0 32px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink);font-size:14px;display:flex;align-items:center;justify-content:center}

/* ---------- Announcement ---------- */
.announcement{background:var(--accent);color:#fff;text-align:center;padding:8px 12px;font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:12px;overflow:hidden;justify-content:center}
.announcement-label{font-weight:700;font-size:12px;white-space:nowrap}
.ticker{overflow:hidden;white-space:nowrap;flex:1;max-width:600px}
.ticker span{display:inline-block;padding-left:100%;animation:ticker 18s linear infinite;font-size:13px}
@keyframes ticker{to{transform:translateX(-100%)}}

/* ---------- Top tab bar (was bottom floating dock) ---------- */
nav.menu-bar{position:sticky;top:0;z-index:900;display:flex;align-items:center;gap:2px;width:100%;
  background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;
  padding:0 8px;scrollbar-width:none}
nav.menu-bar::-webkit-scrollbar{display:none}
.menu-card{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 16px;border-bottom:2px solid transparent;color:var(--muted);font-size:13px;font-weight:500;
  white-space:nowrap;position:relative;transition:color .2s,border-color .2s}
.menu-card:hover{color:var(--accent)}
.menu-card.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.menu-card.disabled{opacity:.45}
.menu-icon{display:flex;align-items:center;justify-content:center;width:16px;font-size:14px}
.menu-lock{font-size:10px;margin-left:2px}

/* ---------- Main content ---------- */
main{flex:1;width:100%;max-width:900px;margin:0 auto;padding:15px}
.page-card{width:100%;min-height:calc(100vh - 260px);background:transparent;border:0;padding:0;box-shadow:none}
.page-card.full-code{padding:0;overflow:hidden}
.hello-title{font-size:24px;font-weight:600;margin-bottom:6px}
.hello-sub{color:var(--muted);line-height:1.8;white-space:pre-wrap;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:55px 0;font-size:14px}

/* Hero banner treatment for the home page content */
.page-card.home{background:linear-gradient(135deg,#ff80ab 0%,#d81b60 100%);border-radius:16px;
  padding:25px 20px;color:#fff;text-align:center;box-shadow:var(--shadow-lg);min-height:auto}
.page-card.home .hello-title,.page-card.home .hello-sub{color:#fff}
.page-card.home .hello-sub{opacity:.9}

/* ---------- Maintenance ---------- */
.maintenance{min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center}
.maintenance .code{font-size:72px;font-weight:700;color:var(--accent)}
.maintenance h1{font-size:22px;margin:6px 0}
.maintenance p{color:var(--muted)}
.spinner{width:64px;height:64px;margin:1em auto 1.6em;border-radius:50%;border:4px solid var(--line);
  border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Chat FAB ---------- */
.chat-fab{position:fixed;right:18px;bottom:18px;z-index:998;width:54px;height:54px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);font-size:22px;border:0;box-shadow:var(--shadow-lg);
  display:flex;align-items:center;justify-content:center}

/* ---------- Buttons / pills ---------- */
.pill{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;
  border-radius:20px;font-size:12.5px;font-weight:500}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.pill.solid:hover{background:var(--accent-dark);color:var(--accent-ink)}
.text-btn{border:0;background:transparent;color:var(--accent);font-size:12px}
.text-btn:hover{text-decoration:underline}

/* ---------- Overlays / modals ---------- */
.overlay{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;
  padding:16px;background:rgba(0,0,0,.45)}
.overlay.show{display:flex}
.modal{width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:22px;background:var(--surface);
  border-radius:18px;box-shadow:var(--shadow-lg)}
.modal.wide{max-width:900px}
.modal h3{font-size:16px;margin-bottom:16px;font-weight:600}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.modal-actions .pill{flex:1;text-align:center}

/* ---------- Forms ---------- */
.field{margin-bottom:13px}
.field label{display:block;margin-bottom:6px;color:var(--muted);font-size:12px}
.field input,.field textarea,.field select{width:100%;padding:10px 13px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface-2);color:var(--ink);outline:none}
.field textarea{min-height:100px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:12px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{flex:1 1 auto;border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:9px;font-size:12px;font-weight:500}
.tabs button.active{background:var(--accent);color:var(--accent-ink)}
.err{min-height:18px;color:var(--danger);font-size:12px;margin-bottom:8px}

/* ---------- Toggle switch ---------- */
.switch{position:relative;display:inline-block;width:42px;height:24px;flex:0 0 42px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.slider{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s;cursor:pointer}
.slider::before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch input:checked+.slider{background:var(--accent)}
.switch input:checked+.slider::before{left:21px}
.switch input:disabled+.slider{opacity:.5;cursor:not-allowed}

/* ---------- Cards (card-box style, matches reference) ---------- */
.setting-card{border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;
  background:var(--surface);box-shadow:var(--shadow)}
.setting-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.setting-head b{font-size:14px}
.setting-head small{display:block;color:var(--muted);margin-top:2px}
.color-row{display:flex;gap:10px;align-items:center}
.color-row input[type=color]{width:44px;height:38px;padding:2px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}

.admin-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;
  margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.admin-info{min-width:0}
.admin-info b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-info small{display:block;color:var(--muted);margin-top:3px;font-size:11.5px}
.admin-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.admin-actions button{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 10px;border-radius:9px;font-size:11px}
.admin-actions .danger{color:var(--danger);border-color:var(--danger)}
.conv-row{cursor:pointer}
.conv-row:hover{border-color:var(--accent)}
.badge{font-size:10px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge.on{border-color:var(--ok);color:var(--ok)}
.badge.off{border-color:var(--danger);color:var(--danger)}

/* ---------- Page builder blocks (product-grid style card) ---------- */
.builder-page{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.content-block{width:100%;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:12px;box-shadow:var(--shadow)}
.content-block.text-block{white-space:pre-wrap;line-height:1.9;font-size:14px;grid-column:1/-1}
.content-block.image-block img{display:block;width:100%;height:120px;object-fit:cover;border-radius:10px}
.content-block.image-block .caption{color:var(--muted);font-size:12px;margin-top:7px;text-align:center}
.builder-list{display:flex;flex-direction:column;gap:9px}
.builder-item{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}
.builder-item-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.builder-preview{margin-top:9px;padding:10px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);max-height:140px;overflow:hidden;font-size:12.5px}
.builder-preview img{max-width:100%;max-height:110px;object-fit:contain;border-radius:8px}
.builder-toolbar{display:flex;gap:6px;flex-wrap:wrap}
.builder-toolbar button{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 9px;border-radius:9px;font-size:11px}

/* ---------- Code / link pages ---------- */
.code-page{width:100%;min-height:70vh}
.code-frame{display:block;width:100%;min-height:calc(100vh - 260px);height:70vh;border:0;background:#fff;border-radius:14px}
.link-page{text-align:center;padding:70px 15px;color:var(--muted)}

/* ---------- Icon picker ---------- */
.icon-palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.icon-palette button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px;display:flex;align-items:center;justify-content:center}
.icon-palette button:hover{border-color:var(--accent)}
.icon-row{display:flex;align-items:center;gap:10px}
.icon-row input{flex:1}
.icon-preview{width:42px;height:42px;flex:0 0 auto;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px}

/* ---------- Chat ---------- */
.chat-modal{max-width:400px;display:flex;flex-direction:column;height:70vh;padding:0;overflow:hidden}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line);font-size:14px}
.chat-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.chat-bubble{max-width:80%;padding:9px 13px;border-radius:16px;font-size:13.5px;line-height:1.6}
.chat-bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.chat-bubble.admin{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-bubble.ai{align-self:flex-start;background:var(--accent-soft);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-meta{font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:600}
.chat-bubble.me .chat-meta{color:rgba(255,255,255,.85)}
.chat-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--surface)}
.chat-input-row input{flex:1;padding:10px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--ink);outline:none}
.chat-list{display:flex;gap:14px;align-items:flex-start}
.chat-list-col{flex:0 0 220px;max-height:60vh;overflow-y:auto}
.chat-conv-col{flex:1;min-width:0;display:flex;flex-direction:column;height:60vh}
.chat-conv-messages{flex:1;overflow-y:auto;padding:10px;border-radius:14px;display:flex;flex-direction:column;gap:8px}

/* ---------- Responsive ---------- */
.page-card pre,.page-card code{max-width:100%;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.page-card table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse}
.page-card button{max-width:100%;white-space:normal;overflow-wrap:anywhere}
@media(max-width:750px){.chat-list{flex-direction:column}.chat-list-col{flex:0 0 auto;max-height:180px;width:100%}}
@media(max-width:650px){
  header{padding:9px 12px}.auth-box .user-name{display:none}
  main{padding:12px}
  .grid2{grid-template-columns:1fr}.maintenance .code{font-size:56px}
  .admin-row{align-items:flex-start;flex-direction:column}.admin-actions{width:100%;justify-content:flex-start}
  .chat-fab{right:14px;bottom:14px;width:48px;height:48px;font-size:19px}
  .hello-title{font-size:20px}
}
</style>

<style id="np404-polished-ui">
/* =========================================================
   NP-404 POLISHED UI
   ปรับการจัดวาง / Hover / Responsive / Typography
   โดยไม่แตะระบบ Firebase, API และฟังก์ชันเดิม
   ========================================================= */
:root{
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 4px 18px rgba(25,25,35,.055);
  --shadow-lg:0 18px 50px rgba(25,25,35,.14);
  --ease:cubic-bezier(.2,.75,.25,1);
}

html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(circle at 8% 0%, rgba(233,30,99,.055), transparent 30%),
    radial-gradient(circle at 92% 10%, rgba(233,30,99,.035), transparent 26%),
    var(--bg);
  letter-spacing:.05px;
}

/* Header */
header{
  min-height:64px;
  padding:10px clamp(14px,3vw,28px);
  backdrop-filter:blur(14px);
  background:color-mix(in srgb,var(--surface) 91%,transparent);
  border-bottom:1px solid color-mix(in srgb,var(--line) 80%,transparent);
  box-shadow:0 4px 18px rgba(0,0,0,.045);
}
.brand-wrap{gap:12px}
.logo{
  width:44px;height:44px;border-radius:13px;
  box-shadow:0 5px 14px rgba(233,30,99,.16);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease);
}
.logo:hover{transform:translateY(-2px) rotate(-1deg);box-shadow:0 8px 20px rgba(233,30,99,.22)}
.brand{font-size:18px;letter-spacing:.15px}
.auth-box{gap:7px}
.auth-box>span:not(.user-name){font-size:12px}
.user-name{
  padding:7px 12px;
  box-shadow:inset 0 0 0 1px rgba(233,30,99,.04);
}
.theme-btn{transition:all .2s var(--ease)}
.theme-btn:hover{transform:translateY(-2px);border-color:var(--accent);color:var(--accent)}

/* Announcement */
.announcement{
  min-height:36px;
  padding:7px 14px;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}
.announcement-label{
  display:inline-flex;align-items:center;gap:6px;
}
.announcement-label::before{content:"📢";font-size:11px}
.ticker span{font-size:12.5px}

/* Navigation */
nav.menu-bar{
  position:sticky;
  top:64px;
  z-index:900;
  min-height:56px;
  padding:5px clamp(8px,2vw,18px);
  gap:5px;
  box-shadow:0 3px 14px rgba(0,0,0,.035);
  backdrop-filter:blur(12px);
}
.menu-card{
  min-height:44px;
  padding:9px 15px;
  border:1px solid transparent;
  border-bottom:0;
  border-radius:13px;
  gap:8px;
  transition:all .22s var(--ease);
}
.menu-card:hover{
  background:var(--accent-soft);
  transform:translateY(-1px);
}
.menu-card.active{
  background:var(--accent-soft);
  border-color:color-mix(in srgb,var(--accent) 18%,var(--line));
  color:var(--accent);
  border-bottom:0;
  box-shadow:0 3px 10px rgba(233,30,99,.08);
}
.menu-icon{width:19px;font-size:15px}
.menu-label{line-height:1.2}

/* Main layout */
main{
  max-width:1080px;
  padding:24px clamp(13px,3vw,28px) 42px;
}
.page-card{
  min-height:calc(100vh - 255px);
}
.page-card.home{
  position:relative;
  overflow:hidden;
  min-height:240px;
  padding:clamp(34px,6vw,64px) clamp(20px,6vw,70px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-radius:24px;
  background:
    radial-gradient(circle at 10% 10%,rgba(255,255,255,.28),transparent 25%),
    radial-gradient(circle at 90% 90%,rgba(80,0,40,.18),transparent 32%),
    linear-gradient(135deg,#ff86ad 0%,#ec3f78 48%,#c9185b 100%);
}
.page-card.home::before,
.page-card.home::after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  pointer-events:none;
}
.page-card.home::before{width:180px;height:180px;left:-70px;top:-70px}
.page-card.home::after{width:230px;height:230px;right:-100px;bottom:-110px}
.page-card.home .hello-title{
  position:relative;
  z-index:1;
  font-size:clamp(27px,4vw,42px);
  line-height:1.2;
  margin-bottom:13px;
  text-shadow:0 3px 14px rgba(80,0,35,.16);
}
.page-card.home .hello-sub{
  position:relative;
  z-index:1;
  max-width:720px;
  font-size:clamp(14px,2vw,17px);
  line-height:1.9;
}

/* Content cards */
.builder-page{
  grid-template-columns:repeat(12,minmax(0,1fr));
  gap:18px;
  align-items:start;
}
.content-block{
  grid-column:span 6;
  min-width:0;
  padding:18px;
  border-radius:17px;
  box-shadow:var(--shadow);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s var(--ease);
}
.content-block:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 28px rgba(20,20,30,.09);
  border-color:color-mix(in srgb,var(--accent) 22%,var(--line));
}
.content-block.text-block{
  grid-column:1/-1;
  font-size:15px;
  line-height:2;
}
.content-block.image-block img{
  height:clamp(170px,25vw,280px);
  border-radius:13px;
}
.content-block.image-block .caption{
  margin-top:10px;
  line-height:1.6;
}

/* Cards / admin */
.setting-card{
  padding:19px;
  margin-bottom:16px;
  border-radius:17px;
  box-shadow:var(--shadow);
  transition:box-shadow .2s var(--ease),transform .2s var(--ease);
}
.setting-card:hover{box-shadow:0 9px 25px rgba(20,20,30,.075)}
.setting-head{min-height:38px;align-items:center;margin-bottom:13px}
.setting-head b{font-size:14.5px}
.setting-head small{font-size:11.5px;line-height:1.55}
.admin-row{
  padding:13px 15px;
  margin-bottom:9px;
  border-radius:14px;
  transition:all .2s var(--ease);
}
.admin-row:hover{

.field{margin-bottom:15px}

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwNzOPeq1ySwZET-yNLabubjiGx-BsLjTpuWuV6cz0AG1MEBkggvSEh6bCnHq5lH7WB/exec",HOME_ID="home";
const ICONS=['🏠','📄','📢','🛒','🎮','📚','🎵','🎬','💬','⚙️','🧾','📊','🗂️','🎯','⭐','❤️','🔥','🚀','🎁','📷','🗓️','✅','📌','🔔','🌐','💡','🔒','🧩','🏆','☕','🔗'];
let pages=[],links=[],settings={},activeId=HOME_ID,authTab="login",editingPageRow=null,editingLinkRow=null,builderBlocks=[];
let conversations=[],usersList=[],activeConvUserId=null,adminChatTimer=null,chatPollTimer=null;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function apiGet(a){return fetch(API_URL+"?action="+encodeURIComponent(a)).then(r=>r.json()).then(x=>{if(x.success===false)throw Error(x.error);return x.data!==undefined?x.data:x})}
async function apiGetAuth(a,params){const token=window.__getIdToken?await window.__getIdToken():null;let qs="?action="+encodeURIComponent(a)+"&idToken="+encodeURIComponent(token||"");Object.keys(params||{}).forEach(k=>qs+="&"+k+"="+encodeURIComponent(params[k]));return fetch(API_URL+qs).then(r=>r.json()).then(x=>{if(x.success===false)throw Error(x.error);return x.data!==undefined?x.data:x})}
async function apiPost(d){
  const token=window.__getIdToken?await window.__getIdToken():null;
  if(!token)throw Error("กรุณาเข้าสู่ระบบก่อนทำรายการนี้");
  return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...d,idToken:token})})
    .then(r=>r.json()).then(x=>{if(x.success===false)throw Error(x.error);return x.data!==undefined?x.data:x});
}
function closeOverlay(id){$(id).classList.remove("show")}window.closeOverlay=closeOverlay;
function toast(m,ok=true){$("notificationTitle").innerText=ok?"สำเร็จ":"แจ้งเตือน";$("notificationText").innerText=m||"";$("notificationModal").classList.add("show")}

function applyTheme(mode){document.documentElement.setAttribute("data-theme",mode==="dark"?"dark":"light");localStorage.setItem("np404_theme",mode);let b=$("themeBtn");if(b)b.innerHTML=mode==="dark"?'<i class="fa-solid fa-sun"></i>':'<i class="fa-solid fa-moon"></i>'}

async function loadAll(){try{let a=await apiGet("getAll");pages=a.pages||[];links=a.links||[];settings=a.settings||{};window.__ADMIN_EMAIL=settings.adminEmail||"admin@np404.com";applySettings();renderMenu();renderActivePage();renderAdmin();if(settings.popupEnabled==="true"&&settings.popupDetail)setTimeout(showPopup,700)}catch(e){console.error(e);$("pageContent").innerHTML='<div class="empty">โหลดระบบไม่สำเร็จ กรุณาตรวจสอบ API_URL และ Apps Script</div>'}}
function applySettings(){

  let b=$("authBox"),u=window.__currentUser;

/* ---------------- Menu (การ์ดไอคอน) ---------------- */
function menuIconClass(icon,isHome,type){
  const v=String(icon||"").trim();
  if(isHome || v.includes("🏠") || v.toLowerCase()==="home") return "fa-house";
  if(v.includes("🔗") || type==="link") return "fa-link";
  if(v.includes("📄")) return "fa-file-lines";
  if(v.includes("👤") || v.includes("บัญชี")) return "fa-user";
  if(v.includes("⚙") || v.includes("ตั้งค่า")) return "fa-gear";
  if(v.includes("📢")) return "fa-bullhorn";
  if(v.includes("💬")) return "fa-comments";
  if(v.includes("🔔")) return "fa-bell";
  if(v.includes("📅")) return "fa-calendar-days";
  if(v.includes("📚")) return "fa-book";

function deletePageConfirm(r){let p=pages.find(x=>x.rowIndex===r);confirmAction("ยืนยันการลบ","ต้องการลบเมนู "+(p?.name||"นี้")+" ใช่หรือไม่?",async()=>{await apiPost({action:"deletePage",rowIndex:r});activeId=HOME_ID;await loadAll();toast("ลบเมนูแล้ว")})}window.deletePageConfirm=deletePageConfirm;

function renderLinks(){let b=$("adminLinks");b.innerHTML='<button class="pill solid" style="width:100%;margin-bottom:12px" onclick="openLinkEditor()">+ เพิ่มลิงก์</button>';if(!links.length){b.innerHTML+='<div class="empty">ยังไม่มีลิงก์</div>';return}links.forEach(l=>b.innerHTML+='<div class="admin-row"><div class="admin-info"><b>'+esc(l.icon||"🔗")+' '+esc(l.name)+'</b><small>'+esc(l.category||"ไม่ระบุหมวดหมู่")+' · '+esc(l.url)+'</small></div><div class="admin-actions"><span class="badge '+(l.active?"on":"off")+'">'+(l.active?"เปิดใช้งาน":"ปิดปรับปรุง")+'</span><label class="switch"><input type="checkbox" '+(l.active?"checked":"")+' onchange="setLinkStatus('+l.rowIndex+',this.checked)"><span class="slider"></span></label><button onclick="openLinkEditor('+l.rowIndex+')">แก้ไข</button><button class="danger" onclick="deleteLinkConfirm('+l.rowIndex+')">ลบ</button></div></div>')}
function openLinkEditor(r){editingLinkRow=r||null;let l=r?links.find(x=>x.rowIndex===r):null;$("linkModalTitle").innerText=l?"แก้ไขลิงก์":"เพิ่มลิงก์";$("linkNameInput").value=l?.name||"";$("linkUrlInput").value=l?.url||"";$("linkCategoryInput").value=l?.category||"";$("linkIconInput").value=l?.icon||"";$("linkIconPreview").innerText=l?.icon||"🔗";$("linkIconPalette").innerHTML=iconPalette("linkIconInput","linkIconPreview");$("linkModal").classList.add("show")}window.openLinkEditor=openLinkEditor;
async function saveLink(){try{let n=$("linkNameInput").value.trim(),u=$("linkUrlInput").value.trim(),c=$("linkCategoryInput").value.trim(),icon=$("linkIconInput").value.trim();if(!n||!u)throw Error("กรุณากรอกชื่อและ URL");let d={action:editingLinkRow?"updateLink":"addLink",name:n,url:u,category:c,icon,active:true};if(editingLinkRow)d.rowIndex=editingLinkRow;await apiPost(d);closeOverlay("linkModal");await loadAll();toast("บันทึกลิงก์แล้ว")}catch(e){toast(e.message,false)}}window.saveLink=saveLink;
async function setLinkStatus(r,v){try{await apiPost({action:"setLinkActive",rowIndex:r,active:v});let l=links.find(x=>x.rowIndex===r);if(l)l.active=v;renderMenu();renderLinks();toast(v?"เปิดลิงก์แล้ว":"ปิดปรับปรุงแล้ว")}catch(e){toast(e.message,false)}}window.setLinkStatus=setLinkStatus;
function deleteLinkConfirm(r){let l=links.find(x=>x.rowIndex===r);confirmAction("ยืนยันการลบ","ต้องการลบลิงก์ "+(l?.name||"นี้")+" ใช่หรือไม่?",async()=>{await apiPost({action:"deleteLink",rowIndex:r});activeId=HOME_ID;await loadAll();toast("ลบลิงก์แล้ว")})}window.deleteLinkConfirm=deleteLinkConfirm;

function renderPopup(){$("adminPopup").innerHTML='<div class="setting-card"><div class="setting-head"><div><b>ระบบป๊อปอัปประกาศ</b><small>พักการแสดงได้ 60 นาทีด้วย localStorage</small></div><label class="switch"><input id="popupEnabled" type="checkbox" '+(settings.popupEnabled==="true"?"checked":"")+'><span class="slider"></span></label></div><div class="field"><label>หัวข้อประกาศ</label><input id="popupTitleInput" value="'+esc(settings.popupTitle||"")+'"></div><div class="field"><label>รายละเอียดประกาศ</label><textarea id="popupDetailInput">'+esc(settings.popupDetail||"")+'</textarea></div><div class="field"><label>URL รูปภาพประกอบ</label><input id="popupImageUrlInput" value="'+esc(settings.popupImageUrl||"")+'"></div><button class="pill solid" onclick="savePopup()">บันทึกป๊อปอัป</button></div>'}
async function savePopup(){try{let o={popupEnabled:$("popupEnabled").checked?"true":"false",popupTitle:$("popupTitleInput").value.trim(),popupDetail:$("popupDetailInput").value,popupImageUrl:$("popupImageUrlInput").value.trim()};await saveSettings(o);toast("บันทึกป๊อปอัปแล้ว")}catch(e){toast(e.message,false)}}window.savePopup=savePopup;
function showPopup(){if(Number(localStorage.getItem("np404_popup_snooze")||0)>Date.now())return;$("popupTitle").innerText=settings.popupTitle||"ประกาศ";$("popupDetail").innerText=settings.popupDetail||"";let i=$("popupImage");if(settings.popupImageUrl){i.src=settings.popupImageUrl;i.classList.remove("hidden")}else i.classList.add("hidden");$("announcementPopup").classList.add("show")}
function snoozePopup(){localStorage.setItem("np404_popup_snooze",String(Date.now()+3600000));closeOverlay("announcementPopup")}window.snoozePopup=snoozePopup;

/* ---------------- Admin: บัญชีผู้ใช้ ---------------- */
async function loadUsers(){try{usersList=await apiGetAuth("getUsers");renderUsers()}catch(e){$("adminUsers").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function renderUsers(){let b=$("adminUsers");if(!usersList.length){b.innerHTML='<div class="empty">ยังไม่มีผู้ใช้ลงทะเบียนในระบบ</div>';return}
  b.innerHTML='<div style="margin-bottom:10px;color:var(--muted);font-size:12px">ทั้งหมด '+usersList.length+' บัญชี</div>'+usersList.map(u=>
  '<div class="admin-row"><div class="admin-info"><b>'+esc(u.username||u.name||u.email||"ผู้ใช้")+' '+(u.role==="admin"?'<span class="badge on">ADMIN</span>':"")+'</b><small>'+esc(u.email)+' · สมัคร '+fmtDate(u.createdAt)+' · เข้าระบบล่าสุด '+fmtDate(u.lastSeen)+'</small></div><div class="admin-actions"><span class="badge '+(u.banned?"off":"on")+'">'+(u.banned?"ถูกระงับ":"ปกติ")+'</span>'+(u.role==="admin"?"":'<label class="switch"><input type="checkbox" '+(u.banned?"":"checked")+' onchange="toggleBan(\''+u.uid+'\',!this.checked)"><span class="slider"></span></label>')+'</div></div>'
  ).join("")}
async function toggleBan(uid,banned){try{await apiPost({action:"setUserBan",uid,banned});toast(banned?"ระงับผู้ใช้แล้ว":"ยกเลิกการระงับแล้ว");loadUsers()}catch(e){toast(e.message,false)}}window.toggleBan=toggleBan;

/* ---------------- Admin: แชท (ตอบผู้ใช้) ---------------- */
async function loadConversations(){try{conversations=await apiGetAuth("getConversations");renderConversationList()}catch(e){$("adminChat").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function renderConversationList(){
  if(!$("adminChat").querySelector(".chat-list")){
    $("adminChat").innerHTML='<div class="chat-list"><div class="chat-list-col" id="adminChatList"></div><div class="chat-conv-col"><div id="adminConvMessages" class="chat-conv-messages"><div class="empty">เลือกการสนทนาทางซ้ายเพื่อเริ่มตอบกลับ</div></div><div class="chat-input-row" style="border-top:1px solid var(--line);margin-top:8px;border-radius:14px"><input id="adminChatInput" placeholder="พิมพ์ข้อความตอบกลับ..." onkeydown="if(event.key===\'Enter\')sendAdminReply()"><button class="pill solid" onclick="sendAdminReply()">ส่ง</button></div></div></div>';
  }
  let b=$("adminChatList");
  if(!conversations.length){b.innerHTML='<div class="empty">ยังไม่มีการสนทนา</div>';return}
  b.innerHTML=conversations.map(c=>'<div class="admin-row conv-row" onclick="openConversation(\''+c.userId+'\')" style="'+(c.userId===activeConvUserId?"border-color:var(--accent)":"")+'"><div class="admin-info"><b>'+esc(c.username||c.userName||c.email||"ผู้ใช้")+' '+(c.unread?'<span class="badge on">'+c.unread+' ใหม่</span>':"")+'</b><small>'+esc((c.lastMessage||"").slice(0,50))+'</small></div></div>').join("");
}
function openConversation(uid){activeConvUserId=uid;loadConversationMessages()}window.openConversation=openConversation;
async function loadConversationMessages(){if(!activeConvUserId)return;try{let msgs=await apiGetAuth("getChatFor",{userId:activeConvUserId});renderAdminChatMessages(msgs)}catch(e){toast(e.message,false)}}
function renderAdminChatMessages(msgs){let box=$("adminConvMessages");if(!box)return;box.innerHTML=msgs.map(m=>'<div class="chat-bubble '+(m.sender==="admin"?"me":m.sender==="ai"?"ai":"admin")+'"><div class="chat-meta">'+(m.sender==="admin"?"แอดมิน (คุณ)":m.sender==="ai"?"🤖 AI ผู้ช่วย":"ผู้ใช้")+'</div><div class="chat-text">'+esc(m.message)+'</div></div>').join("")||'<div class="empty">ยังไม่มีข้อความ</div>';box.scrollTop=box.scrollHeight}
async function sendAdminReply(){let inp=$("adminChatInput");if(!inp||!activeConvUserId)return;let msg=inp.value.trim();if(!msg)return;inp.value="";try{let data=await apiPost({action:"adminReplyChat",userId:activeConvUserId,message:msg});renderAdminChatMessages(data);loadConversations()}catch(e){toast(e.message,false)}}window.sendAdminReply=sendAdminReply;

/* ---------------- Chat ผู้ใช้ทั่วไป (ลอยมุมจอ) ---------------- */
function openChat(){if(!window.__currentUser){toast("กรุณาเข้าสู่ระบบก่อนใช้งานแชท",false);openAuthModal();return}$("chatModal").classList.add("show");loadChat();if(chatPollTimer)clearInterval(chatPollTimer);chatPollTimer=setInterval(loadChat,6000)}window.openChat=openChat;
function closeChatModal(){closeOverlay("chatModal");if(chatPollTimer){clearInterval(chatPollTimer);chatPollTimer=null}}window.closeChatModal=closeChatModal;
async function loadChat(){try{let msgs=await apiGetAuth("getChat");renderChatMessages(msgs)}catch(e){/* เงียบไว้ระหว่าง poll */}}
function renderChatMessages(msgs){let box=$("chatMessages");box.innerHTML=msgs.map(m=>'<div class="chat-bubble '+(m.sender==="user"?"me":m.sender==="ai"?"ai":"admin")+'"><div class="chat-meta">'+(m.sender==="user"?"คุณ":m.sender==="ai"?"🤖 AI ผู้ช่วย":"🛡️ แอดมิน")+'</div><div class="chat-text">'+esc(m.message)+'</div></div>').join("")||'<div class="empty">พิมพ์ข้อความเพื่อเริ่มแชทกับแอดมินหรือ AI ได้เลย</div>';box.scrollTop=box.scrollHeight}
async function sendChat(){let inp=$("chatInput");let msg=inp.value.trim();if(!msg)return;inp.value="";try{let data=await apiPost({action:"sendChatMessage",message:msg});renderChatMessages(data)}catch(e){toast(e.message,false)}}window.sendChat=sendChat;

/* ---------------- Confirm/Logout ---------------- */
function confirmAction(t,m,fn){$("confirmTitle").innerText=t;$("confirmText").innerText=m;$("confirmOk").onclick=async()=>{closeOverlay("confirmModal");try{await fn()}catch(e){toast(e.message,false)}};$("confirmModal").classList.add("show")}
function confirmLogoutAdmin(){confirmAction("ออกจาก Admin","ต้องการออกจากระบบ Admin และปิดแผงควบคุมใช่หรือไม่?",async()=>{closeOverlay("adminModal");await window.doLogout();toast("ออกจากระบบแล้ว")})}window.confirmLogoutAdmin=confirmLogoutAdmin;
loadAll();

function openForgotPasswordModal(){
  $("forgotEmailInput").value = $("authEmail").value.trim();
  $("forgotPasswordModal").classList.add("show");
  setTimeout(()=>{let x=$("forgotEmailInput");if(x)x.focus()},80);
}
window.openForgotPasswordModal=openForgotPasswordModal;

async function sendResetEmail(){
  const email=$("forgotEmailInput").value.trim();
  if(!email){toast("กรุณากรอกอีเมล",false);return}
  try{
    if(!window.__authFns?.sendPasswordResetEmail||!window.__auth) throw new Error("ยังไม่ได้เชื่อมต่อระบบบัญชี");
    await window.__authFns.sendPasswordResetEmail(window.__auth,email);
    closeOverlay("forgotPasswordModal");
    toast("ส่งลิงก์รีเซ็ตรหัสผ่านไปยังอีเมลแล้ว");
  }catch(e){
    let msg="ไม่สามารถส่งลิงก์รีเซ็ตรหัสผ่านได้";
    if(e&&e.code==="auth/user-not-found") msg="ไม่พบอีเมลนี้ในระบบ";
    else if(e&&e.code==="auth/invalid-email") msg="รูปแบบอีเมลไม่ถูกต้อง";
    else if(e&&e.code==="auth/too-many-requests") msg="มีการขอรีเซ็ตหลายครั้ง กรุณาลองใหม่ภายหลัง";
    else if(e&&e.message) msg=e.message;
    toast(msg,false);
  }
}
window.sendResetEmail=sendResetEmail;

</script>

<div class="overlay" id="forgotPasswordModal">
  <div class="modal">
    <div class="setting-head">
      <div><b>ลืมรหัสผ่าน</b><small>ส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปยังอีเมลของคุณ</small></div>
      <button class="pill" onclick="closeOverlay('forgotPasswordModal')">✕</button>
    </div>
    <div class="field">
      <label>อีเมลบัญชี</label>
      <input id="forgotEmailInput" type="email" autocomplete="email" placeholder="กรอกอีเมลที่ใช้สมัคร">
    </div>
    <button class="pill solid" style="width:100%;margin-top:8px" onclick="sendResetEmail()">ส่งลิงก์รีเซ็ตรหัสผ่าน</button>
    <div style="text-align:center;margin-top:12px">
      <button class="pill" onclick="closeOverlay('forgotPasswordModal');openAuthModal()">กลับไปเข้าสู่ระบบ</button>
    </div>
  </div>
</div>

</body></html>
