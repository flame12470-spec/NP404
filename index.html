<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5bd3">
<title>เว็บห้อง ม.4/4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --blue:#0b5bd3;--blue-dark:#0a3f9c;--blue-light:#1e9bff;--yellow:#ffd21f;
  --bg:#f5f7fa;--card:#fff;--text:#1b2330;--muted:#5b6678;--line:#e3e7ee;
  --soft:#eaf2ff;--tile:#f7f8fa;--field:#fff;--faq:#f1f6ff;--shadow:0 4px 16px rgba(0,0,0,.07);--radius:20px;
  --red:#ffe1e1;--redInk:#c0221b;--warn:#fff0c2;--warnInk:#8a5a00;--okBg:#dff7e6;--okInk:#17693a;
  --sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
}
:root[data-theme=dark]{
  --bg:#0e1420;--card:#18202e;--text:#e8edf5;--muted:#9aa6b8;--line:#2a3447;--soft:#1d2b45;
  --tile:#1b2433;--field:#111826;--faq:#1b2536;--shadow:0 4px 16px rgba(0,0,0,.35);
  --red:#4a1f1f;--redInk:#ff8a84;--warn:#4a3b12;--warnInk:#ffd479;--okBg:#173a27;--okInk:#7be0a4;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Prompt',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;line-height:1.55}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;touch-action:manipulation}
input,select,textarea{font:inherit;font-size:16px;color:var(--text)}
a{color:var(--blue);text-decoration:none}
.hide{display:none!important}
.sub,.mu{color:var(--muted);font-size:13px}
.err{color:var(--redInk)}
.ico{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.16em;flex:none}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:50;background:var(--blue);color:#fff;height:calc(64px + var(--sat));padding:var(--sat) 12px 0;display:flex;align-items:center;justify-content:space-between;gap:6px}
.hdr .ib{color:#fff;display:grid;place-items:center;width:44px;height:44px;font-size:26px;position:relative;border-radius:50%}
.hdr .grp{display:flex;align-items:center;gap:2px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:#fff;min-width:0}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--yellow);color:var(--blue);display:grid;place-items:center;font-weight:800;flex:none}
.avatar-btn{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:var(--blue-dark);display:grid;place-items:center;color:var(--yellow);font-weight:700;font-size:16px;margin-left:4px}
.badge{position:absolute;top:4px;right:3px;min-width:18px;height:18px;border-radius:99px;background:#ff4d4f;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

#view{max-width:1100px;margin:0 auto;padding:0 16px calc(110px + var(--sab));min-height:80dvh}
.pghead{display:flex;align-items:center;gap:12px;padding:22px 0 8px}
.pghead h1{font-size:26px;font-weight:600;flex:1;min-width:0;line-height:1.25}
.topsub{color:var(--muted);font-size:14px;margin-bottom:8px}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:24px;flex:none;color:var(--blue)}

/* ---------- drawer ---------- */
.drawer-bg{position:fixed;inset:0;z-index:90;background:rgba(0,10,40,.5);opacity:0;pointer-events:none;transition:.25s}
.drawer-bg.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(340px,86vw);z-index:95;background:var(--card);transform:translateX(-100%);transition:transform .3s;overflow-y:auto;padding-bottom:calc(30px + var(--sab))}
.drawer.show{transform:none}
.drawer-head{height:calc(64px + var(--sat));padding:var(--sat) 16px 0;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:2}
.drawer-head .x{color:#fff;font-size:28px;width:44px;height:44px;display:grid;place-items:center}
.dr-item{border-bottom:1px solid var(--line)}
.dr-item>button,.dr-link{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:17px 20px;font-size:16px;text-align:left;color:var(--text);cursor:pointer}
.dr-link .ico,.dr-sub .ico{color:var(--blue);margin-right:8px}
.dr-item>button .chev{width:20px;height:20px;transition:.2s;color:#9aa3b2}
.dr-item.open>button .chev{transform:rotate(180deg)}
.dr-sub{display:none;background:var(--bg);padding:6px 0}
.dr-item.open .dr-sub{display:block}
.dr-sub a{display:block;padding:12px 28px;color:var(--muted);font-size:15px}
.dr-sub a:hover,.dr-sub a.on{color:var(--blue);font-weight:600}

/* ---------- hero ---------- */
.hero{margin-top:16px;border-radius:var(--radius);overflow:hidden;background:linear-gradient(120deg,#0a4fc4,#1e9bff);color:#fff;box-shadow:var(--shadow)}
.slides{display:flex;transition:transform .5s ease}
.slide{min-width:100%;padding:34px 26px;display:grid;grid-template-columns:1.3fr .7fr;gap:16px;align-items:center}
.slide h1{font-size:clamp(26px,5vw,46px);font-weight:800;color:var(--yellow);text-shadow:0 3px 10px rgba(0,0,0,.25);line-height:1.15;overflow-wrap:anywhere}
.slide .s{font-size:16px;margin:8px 0 2px;opacity:.95}
.slide .b{font-size:clamp(16px,2.6vw,21px);font-weight:600;margin-bottom:16px;overflow-wrap:anywhere}
.btn-pill{display:inline-flex;align-items:center;gap:12px;background:#0a4fc4;border:2px solid #7fb8ff;color:#fff;font-size:17px;font-weight:600;padding:6px 6px 6px 22px;border-radius:99px}
.btn-pill span{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font-size:18px}
.hero-art{font-size:clamp(80px,14vw,130px);text-align:center;opacity:.95;line-height:1}
.hero-art .ico{stroke-width:1.1}
.dots{display:flex;justify-content:center;gap:8px;padding:12px;background:var(--card)}
.dots i{width:10px;height:10px;border-radius:50%;background:#d3d8e0;cursor:pointer}
.dots i.on{width:56px;border-radius:6px;background:#3d8bff}

/* ---------- headings ---------- */
h2.title{text-align:center;font-size:26px;font-weight:600;margin:34px 0 18px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 6px}
.section-title h3{font-size:19px}

/* ---------- tiles ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:6px 0 10px}
.tile{background:var(--tile);border-radius:var(--radius);padding:16px 6px 12px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:116px;position:relative;transition:.15s}
.tile:active{transform:scale(.96)}
.tile:hover{transform:translateY(-3px)}
.tile .emo{font-size:34px;line-height:1;width:58px;height:58px;display:grid;place-items:center;border-radius:18px;background:var(--soft);color:var(--blue)}
.tile .t{font-size:14px;line-height:1.3;color:var(--blue);word-break:break-word}
.tile .t .ico{font-size:12px;margin-left:2px}
.tag-new{position:absolute;top:-6px;right:-3px;background:#7b5cff;color:#fff;font-size:12px;padding:2px 12px;border-radius:99px;font-weight:600}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin:12px 0;padding:18px;position:relative;display:block;width:100%;text-align:left}
.card .t{font-size:17px;font-weight:600;margin-bottom:2px;overflow-wrap:anywhere}
.card p{font-size:14px;overflow-wrap:anywhere}
.card.pinned{border:2px solid var(--yellow)}
.card .pin{color:#e0a800}
.thumb{width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin-top:8px}
.cards-grid{display:grid;grid-template-columns:1fr;gap:0 16px}
.cols3{display:grid;grid-template-columns:1fr;gap:0 16px}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:2px 12px;white-space:nowrap;font-weight:500;background:var(--soft);color:var(--blue)}
.tag.ok{background:var(--okBg);color:var(--okInk)}.tag.part{background:var(--warn);color:var(--warnInk)}.tag.no{background:var(--red);color:var(--redInk)}
.list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:4px 18px;margin:10px 0}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-bottom:1px dashed var(--line);text-align:left}
.item:last-child{border:0}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item select{width:120px;min-height:42px;padding:6px 30px 6px 14px}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0}
.chip2{border-radius:16px;padding:12px 14px;background:var(--card);box-shadow:var(--shadow);text-align:left}
.chip2 small{display:block;font-size:12px;color:var(--muted)}
.chip2 b{font-size:20px;font-weight:700;display:block}
.chip2.hl{background:linear-gradient(120deg,var(--soft),#9cc6ff)}
.in{color:#2e7d32}.out{color:#c62828}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty b{color:var(--text);display:block}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.profile-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin:14px 0;padding:16px;display:flex;align-items:center;gap:14px}
.avatar{width:56px;height:56px;border-radius:50%;border:2px solid var(--blue);background:var(--soft);display:grid;place-items:center;font-weight:700;color:var(--blue);font-size:20px;flex:none}
.profile-card .info{flex:1;min-width:0}
.profile-card .name{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.promo-strip{width:100%;background:linear-gradient(90deg,#e8f1ff,#6fb0ff);color:#0a2a66;border-radius:var(--radius);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;text-align:left;gap:10px;margin:12px 0}
.promo-strip div{min-width:0}.promo-strip b{font-size:17px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.promo-strip small{font-size:13px}.promo-strip .ico{font-size:26px}
.notice{background:#fbf6d0;color:#3a3000;border-radius:16px;padding:14px 46px 14px 18px;display:flex;gap:12px;align-items:flex-start;position:relative;margin-top:16px}
.notice>.ico{font-size:26px;margin-top:2px}
.notice h4{font-size:16px}.notice p{font-size:14px}
.notice .close{position:absolute;right:10px;top:8px;font-size:22px;color:#8a6d00;width:32px;height:32px;display:grid;place-items:center}
.pend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.pend button{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;text-align:left;border-left:5px solid var(--yellow)}
.pend b{font-size:24px;display:block}.pend small{color:var(--muted);font-size:13px}

/* ---------- calendar grid ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:12px 0 8px}
.cal-head b{font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px}
.cal .dw{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cd{min-height:56px;border-radius:12px;padding:5px;background:var(--tile);display:flex;flex-direction:column;justify-content:space-between;font-size:13px}
.cd.e{background:none}
.cd.today{outline:2px solid var(--blue);background:var(--soft)}
.dts{display:flex;gap:3px;flex-wrap:wrap}
.dt{width:8px;height:8px;border-radius:50%;display:block}
.k-calendar{background:#0b5bd3}.k-homework{background:#f5a300}.k-exam{background:#e5383b}.k-activity{background:#12a150}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 4px}
.legend span{display:flex;align-items:center;gap:6px}

/* ---------- FAQ / CTA / footer ---------- */
.faq{display:grid;gap:14px;max-width:900px;margin:0 auto}
.faq-item{background:var(--faq);border-radius:20px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:20px 24px;font-size:17px;text-align:left}
.faq-q .ico{width:22px;height:22px;transition:.25s;stroke-width:3}
.faq-item:not(.open) .faq-q .ico{transform:rotate(180deg)}
.faq-a{padding:0 24px 20px;color:var(--muted);font-size:15px}
.faq-item:not(.open) .faq-a{display:none}
.cta-sec{background:var(--faq);border-radius:var(--radius);text-align:center;padding:40px 20px;margin-top:34px}
.cta-sec h2{font-size:28px;font-weight:700}.cta-sec p{font-size:16px;margin:8px 0 20px;color:var(--muted)}
.foot{margin:30px -16px 0;background:linear-gradient(180deg,#6aa2ee,#0a4fc4);color:#fff;text-align:center;padding:30px 20px calc(30px + var(--sab));font-size:15px}
.foot b{font-size:20px;display:block;margin-bottom:6px}

/* ---------- forms / buttons ---------- */
label{font-size:14px;color:var(--muted);display:block;margin:14px 0 6px}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;padding:13px 18px;border-radius:99px;border:2px solid var(--line);background:var(--field);outline:none;-webkit-appearance:none;appearance:none;min-height:52px}
input[type=file]{width:100%;padding:12px;border:2px dashed var(--line);border-radius:18px;background:var(--field)}
input[type=checkbox]{width:26px;height:26px;accent-color:var(--blue)}
select{background-image:linear-gradient(45deg,transparent 50%,#777 50%),linear-gradient(135deg,#777 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
textarea{border-radius:20px;resize:none;min-height:96px;line-height:1.7}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #bcd3f755}
.search{margin:8px 0 4px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:14px 0;padding:16px;border-radius:16px;background:var(--blue);color:#fff;font-size:18px;font-weight:600;text-align:center;transition:.15s}
.cta:hover{background:var(--blue-dark)}
.cta:active,.btn:active{transform:scale(.97)}
.cta.inline{margin:20px 0 0}
.cta.ghost{background:var(--card);color:var(--blue);border:2px solid var(--blue)}
.cta.y{background:var(--yellow);color:#1b2330}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:99px;font-size:14px;background:var(--card);border:2px solid var(--line);white-space:nowrap}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.sm{padding:6px 14px;font-size:13px}
.btn.r{color:var(--redInk);border-color:var(--red)}
.btn:disabled{opacity:.5}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:14px 0;line-height:1.7}
.row2{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.row2>select{width:160px}.row2>input{flex:1;min-width:140px}

/* ---------- modal / toast / floating ---------- */
#sheetBg{position:fixed;inset:0;background:rgba(0,10,40,.55);backdrop-filter:blur(5px);z-index:100;opacity:0;pointer-events:none;transition:.2s}
#sheetBg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;top:50%;width:min(600px,92vw);max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:28px;z-index:101;padding:32px 26px 28px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:.22s}
#sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
#sheet h2{font-size:24px;font-weight:700;color:var(--blue);margin-bottom:6px;padding-right:44px}
#sheet .x{position:absolute;top:18px;right:18px;width:40px;height:40px;font-size:24px;color:var(--muted);display:grid;place-items:center}
#sheet .grid{padding:8px 0 0}
#toast{position:fixed;left:50%;bottom:calc(30px + var(--sab));transform:translate(-50%,20px);background:#222;color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0);opacity:1}
.fab{position:fixed;right:18px;z-index:40;border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,.25);display:grid;place-items:center}
.fab-top{bottom:calc(20px + var(--sab));width:56px;height:56px;background:var(--card);color:var(--blue);font-size:26px}
.fab-top .ico{stroke-width:3}
.fab-chat{bottom:calc(88px + var(--sab));width:60px;height:60px;background:var(--yellow);color:#1b2330;font-size:28px}
.fade{animation:fade .35s}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media print{.hdr,.fab,.cta,.search,.acts,.drawer{display:none!important}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(min-width:700px){
  .grid{grid-template-columns:repeat(4,1fr)}
  .cards-grid{grid-template-columns:1fr 1fr}
  .cols3{grid-template-columns:repeat(3,1fr)}
  .cd{min-height:78px}
}
@media(min-width:1000px){
  .grid{grid-template-columns:repeat(6,1fr);gap:16px}
  .cards-grid{grid-template-columns:repeat(3,1fr)}
  #sheet .grid{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:620px){.slide{grid-template-columns:1fr}.hero-art{display:none}.logo span.nm2{display:none}}
</style>
</head>
<body>

<header class="hdr">
  <div class="grp">
    <button class="ib" data-act="openMenu" aria-label="เมนู"><svg class="ico" viewBox="0 0 24 24"><path d="M3 7h18M3 12h12M3 17h7"/></svg></button>
    <a class="logo" href="#" data-act="go" data-v="home"><span class="logo-mark">ม</span><span class="nm2">ห้อง ม.4/4</span></a>
  </div>
  <div class="grp">
    <button class="ib" data-act="go" data-v="search" aria-label="ค้นหา"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <button class="ib" data-act="go" data-v="notif" aria-label="การแจ้งเตือน"><svg class="ico" viewBox="0 0 24 24"><path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></svg><span class="badge hide" id="bellN"></span></button>
    <button class="avatar-btn" id="avatarBtn" data-act="avatar" aria-label="บัญชี"></button>
  </div>
</header>

<div class="drawer-bg" id="drawerBg" data-act="closeMenu"></div>
<nav class="drawer" id="drawer" aria-label="เมนูหลัก">
  <div class="drawer-head"><a class="logo" href="#" data-act="go" data-v="home"><span class="logo-mark">ม</span>ห้อง ม.4/4</a><button class="x" data-act="closeMenu" aria-label="ปิดเมนู"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="drawerBody"></div>
</nav>

<main id="view"><div class="card" style="text-align:center"><p class="sub">กำลังโหลด...</p></div></main>

<button class="fab fab-chat" data-act="go" data-v="chat" aria-label="แชตห้องเรียน"><svg class="ico" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
<button class="fab fab-top" data-act="top" aria-label="กลับขึ้นบน"><svg class="ico" viewBox="0 0 24 24"><path d="M12 20V5M5 12l7-7 7 7"/></svg></button>

<div id="sheetBg" data-act="closeSheet"></div><div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

  });
 }
 if(m==='poll'){

async function save(m,id){

 for(const f of M[m][2]){
  const k=f[0],t=f[2],e=$('#f_'+k);if(!e)continue;
  if(t==='file'){
   const file=e.files[0];
   if(file){
    const p=ME.id+'/'+Date.now()+'-'+file.name.replace(/[^\w.-]/g,'_');
    const u=await db.storage.from('files').upload(p,file);
    if(u.error)return toast('อัปโหลดไม่สำเร็จ: '+u.error.message);
    d[k]=db.storage.from('files').getPublicUrl(p).data.publicUrl;
   }
  }else d[k]=e.value.trim();
 }
 if(!String(d[M[m][2][0][0]]||'').trim())return toast('กรอก “'+M[m][2][0][1]+'” ก่อนบันทึก');
 const r=await (id?db.from('items').update({data:d}).eq('id',id):db.from('items').insert({module:m,data:d,created_by:ME.id}));

}

 if(!s){box.innerHTML='<div class="card empty" style="grid-column:1/-1"><b>พิมพ์เพื่อค้นหา</b>ประกาศ การบ้าน เอกสาร สมาชิก และอื่น ๆ</div>';return}
 const rs=(SALL||[]).filter(x=>JSON.stringify(x.data).toLowerCase().includes(s)).slice(0,60);
 box.innerHTML=rs.length?rs.map(x=>{const F=M[x.module][2],d=x.data;return '<button class="card" data-act="go" data-v="'+x.module+'"><span class="tag">'+esc(M[x.module][0])+'</span><div class="t" style="margin-top:6px">'+esc(d[F[0][0]])+'</div><p class="mu">'+esc(F.slice(1,3).map(f=>d[f[0]]).filter(Boolean).join(' · '))+'</p></button>'}).join(''):'<div class="card empty" style="grid-column:1/-1"><b>ไม่พบผลลัพธ์</b></div>';
}

// ====== แจ้งเตือน ======
SP.notif=async function(m,v){
 const list=NOTIF.slice();
 v.innerHTML=head(I('notif')+' การแจ้งเตือน',{back:1,sub:isG()?'เข้าสู่ระบบเพื่อรับการแจ้งเตือนเรื่องใหม่':''})+
  '<div class="cards-grid">'+(list.length?list.map(x=>{const F=M[x.module][2];return '<button class="card" data-act="go" data-v="'+x.module+'"><span class="tag">'+esc(M[x.module][0])+'</span><div class="t" style="margin-top:6px">'+esc(x.data[F[0][0]])+'</div><p class="mu">'+new Date(x.created_at).toLocaleString('th-TH')+'</p></button>'}).join(''):'<div class="card empty" style="grid-column:1/-1"><b>ไม่มีการแจ้งเตือนใหม่</b>เรื่องใหม่ในประกาศ การบ้าน ตารางสอบ จะมาแสดงที่นี่</div>')+'</div>';
 if(!isG()){LS.set('seen_'+ME.id,new Date().toISOString());NOTIF=[];drawBell()}
};

// ====== โปรไฟล์ ======
SP.profile=function(m,v){
 if(isG())return gate(v,m);
 const dark=document.documentElement.dataset.theme==='dark';
 v.innerHTML=head(I('profile')+' โปรไฟล์ของฉัน',{back:1})+profileCard()+
  '<div class="card"><p><span class="mu">อีเมล:</span> '+esc(ME.email||'-')+'</p><p><span class="mu">สถานะ:</span> '+ROLE[ME.role||'student']+'</p></div>'+
  '<div class="card"><div class="t">แก้ไขชื่อ-สกุล</div><input type="text" id="pn" value="'+esc(ME.name||'')+'"><button class="cta inline" data-act="saveName">บันทึกชื่อ</button></div>'+
  '<div class="card"><div class="t">เปลี่ยนรหัสผ่าน</div><label>รหัสผ่านใหม่ (อย่างน้อย 6 ตัว)</label><input type="password" id="pw1" autocomplete="new-password"><label>ยืนยันรหัสผ่านใหม่</label><input type="password" id="pw2" autocomplete="new-password"><button class="cta inline" data-act="changePw">เปลี่ยนรหัสผ่าน</button></div>'+
  '<div class="card"><div class="t">ธีมการแสดงผล</div><div class="acts"><button class="btn" data-act="theme">'+I(dark?'sun':'moon')+(dark?'เปลี่ยนเป็นโหมดสว่าง':'เปลี่ยนเป็นโหมดมืด')+'</button></div></div>';
};
async function saveName(){
 const n=$('#pn').value.trim();if(!n)return toast('กรอกชื่อก่อน');
 if(n!==ME.name){const t=await db.rpc('name_taken',{n:n});if(t.error)return toast(em(t.error));if(t.data)return toast('ชื่อนี้มีคนใช้แล้ว');}
 const r=await db.from('profiles').update({name:n}).eq('id',ME.id);if(r.error)return toast(r.error.message);
 ME.name=n;drawHeader();toast('บันทึกชื่อแล้ว');show('profile',1);
}
async function changePw(){
 const a=$('#pw1').value,b=$('#pw2').value;
 if(a.length<6)return toast('รหัสผ่านอย่างน้อย 6 ตัว');if(a!==b)return toast('รหัสผ่านสองช่องไม่ตรงกัน');
 const r=await db.auth.updateUser({password:a});toast(r.error?em(r.error):'เปลี่ยนรหัสผ่านแล้ว');
 if(!r.error){$('#pw1').value='';$('#pw2').value=''}
}
function theme(){
 const d=document.documentElement.dataset.theme==='dark'?'light':'dark';
 document.documentElement.dataset.theme=d;LS.set('theme',d);show('profile',1);
}

// ====== events ======
const A={
 closeSheet:closeSheet,
 openMenu(){setMenu(true)},closeMenu(){setMenu(false)},
 dr(t){t.parentElement.classList.toggle('open')},
 faq(t){t.parentElement.classList.toggle('open')},
 slide(t){goSlide(+t.dataset.i)},
 top(){scrollTo({top:0,behavior:'smooth'})},
 avatar(){isG()?authChoice():A.go({dataset:{v:'profile'}})},
 closeNotice(){const n=$('#notice');if(n)n.remove()},
 go(t){closeSheet();setMenu(false);const k=t.dataset.v;if(k==='home')stack=[];else if(k!==cur)stack.push(cur);show(k)},
 back(){show(stack.length?stack.pop():'home')},
 authChoice:authChoice,loginSheet:loginSheet,signupSheet:signupSheet,forgotSheet:forgotSheet,
 login:login,signup:signup,logout:logout,sendReset:sendReset,setNewPw:setNewPw,
 saveName:saveName,changePw:changePw,theme:theme,
 cal(t){CMo+=+t.dataset.d;if(CMo<0){CMo=11;CY--}if(CMo>11){CMo=0;CY++}show('calendar',1)},
 bulkAtt:bulkAtt,bulkSave:bulkSave,
 openForm(t){openForm(t.dataset.m,t.dataset.id||undefined)},
 save(t){save(t.dataset.m,t.dataset.id||'')},
 del(t){del(t.dataset.id)},
 vote(t){vote(t.dataset.poll,t.dataset.c)},
 setRole(t){setRole(t.dataset.id)},
 restore(t){restore(t.dataset.id)},
 csv(t){csv(t.dataset.v)},
 backup:backup,
 printPage(){window.print()}
};
document.addEventListener('click',function(e){
 const t=e.target.closest('[data-act]');if(!t||t.type==='checkbox')return;
 const f=A[t.dataset.act];if(f){e.preventDefault();Promise.resolve(f(t,e)).catch(function(x){toast(em(x))})}
});
document.addEventListener('change',function(e){
 const t=e.target;
 if(t&&t.type==='checkbox'&&t.dataset.act==='setLock')setLock(t.dataset.k,t.checked);
});
document.addEventListener('input',function(e){
 if(!e.target)return;
 if(e.target.id==='qs'){Q=e.target.value;paint(cur)}
 if(e.target.id==='gs')gsPaint();
});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){closeSheet();setMenu(false)}
 if(e.key==='Enter'&&e.target&&e.target.id==='ap'){e.preventDefault();($('#an')?signup:login)()}
 if(e.key==='Enter'&&e.target&&e.target.id==='fe'){e.preventDefault();sendReset()}
});

boot();
})();
</script>
