<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#6593c7">

<meta name="description"
      content="กำลังเตรียมระบบ">

<title>กำลังเตรียมระบบ</title>


<!-- ================= GOOGLE FONT ================= -->

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet">


<style>

/* ================= RESET ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:"Kanit",sans-serif;
    overflow:hidden;
}


/* ================= PAGE ================= */

.page{

    width:100%;
    min-height:100svh;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
    overflow:hidden;

    color:#fff;

    background:

        radial-gradient(
            circle at 50% 35%,
            rgba(255,255,255,.16),
            transparent 38%
        ),

        radial-gradient(
            circle at 50% 50%,
            rgba(255,255,255,.06),
            transparent 60%
        ),

        #6593c7;
}


/* ================= BACKGROUND GLOW ================= */

.page::before{

    content:"";

    position:absolute;

    width:650px;
    height:650px;

    left:50%;
    top:40%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(255,255,255,.13),
            rgba(255,255,255,.04) 35%,
            transparent 70%
        );

    filter:blur(35px);

    animation:
        backgroundPulse 5s ease-in-out infinite;

    pointer-events:none;

    z-index:1;
}


/* ================= CONTENT ================= */

.content{

    width:min(92%,1000px);

    position:relative;

    z-index:10;

    text-align:center;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    padding:30px 15px;
}


/* ================= LOGO ================= */

.logo-wrapper{

    width:310px;
    height:230px;

    display:flex;

    align-items:center;
    justify-content:center;

    position:relative;

    margin-bottom:5px;

    overflow:visible;

    z-index:20;
}


/* ================= LOGO GLOW ================= */

.logo-wrapper::before{

    content:"";

    position:absolute;

    width:260px;
    height:180px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:

        radial-gradient(
            ellipse,
            rgba(255,255,255,.45),
            rgba(255,255,255,.12) 35%,
            transparent 72%
        );

    filter:blur(28px);

    animation:
        logoPulse 4s ease-in-out infinite;

    pointer-events:none;

    z-index:0;
}


/* ================= MAIN LOGO ================= */

.logo{

    display:block;

    width:260px;
    height:260px;

    object-fit:contain;

    position:relative;

    z-index:30;

    opacity:1;

    visibility:visible;

    filter:

        drop-shadow(
            0 0 5px
            rgba(255,255,255,.9)
        )

        drop-shadow(
            0 0 20px
            rgba(255,255,255,.55)
        )

        drop-shadow(
            0 0 45px
            rgba(255,255,255,.25)
        );

    animation:
        logoFloat 4s ease-in-out infinite;

    pointer-events:none;
}


/* ================= TITLE ================= */

.title{

    font-size:
        clamp(34px,5vw,58px);

    font-weight:700;

    letter-spacing:-1.5px;

    line-height:1.25;

    text-shadow:
        0 3px 15px
        rgba(0,0,0,.06);

    animation:
        fadeUp .9s ease both;

    position:relative;

    z-index:10;
}


/* ================= SUBTITLE ================= */

.subtitle{

    margin-top:20px;

    font-size:
        clamp(17px,2.2vw,25px);

    line-height:1.7;

    color:
        rgba(255,255,255,.94);

    max-width:850px;

    animation:
        fadeUp .9s .12s ease both;

    position:relative;

    z-index:10;
}


/* ================= WEBSITE BUTTON ================= */

.website-button{

    display:inline-flex;

    align-items:center;
    justify-content:center;

    margin-top:28px;

    padding:14px 30px;

    min-width:220px;

    border-radius:16px;

    background:
        rgba(255,255,255,.18);

    border:
        1px solid
        rgba(255,255,255,.38);

    color:#fff;

    text-decoration:none;

    font-size:17px;

    font-weight:600;

    backdrop-filter:blur(15px);

    -webkit-backdrop-filter:blur(15px);

    box-shadow:

        0 12px 35px
        rgba(0,0,0,.12),

        inset 0 1px 0
        rgba(255,255,255,.25);

    transition:

        transform .25s ease,
        background .25s ease,
        box-shadow .25s ease;

    animation:
        fadeUp .9s .25s ease both;
}


.website-button:hover{

    transform:
        translateY(-3px)
        scale(1.02);

    background:
        rgba(255,255,255,.28);

    box-shadow:

        0 16px 40px
        rgba(0,0,0,.18),

        inset 0 1px 0
        rgba(255,255,255,.35);
}


.website-button:active{

    transform:
        scale(.97);
}


/* ================= FOOTER ================= */

.footer{

    margin-top:20px;

    font-size:12px;

    opacity:.55;

    animation:
        fadeUp .9s .35s ease both;
}


/* ================= ANIMATIONS ================= */

@keyframes logoFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }
}


@keyframes logoPulse{

    0%,100%{

        opacity:.65;

        transform:
            translate(-50%,-50%)
            scale(.9);
    }

    50%{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.08);
    }
}


@keyframes backgroundPulse{

    0%,100%{
        opacity:.7;
    }

    50%{
        opacity:1;
    }
}


@keyframes fadeUp{

    from{

        opacity:0;

        transform:
            translateY(18px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    .content{

        padding:
            20px 12px;
    }


    .logo-wrapper{

        width:250px;
        height:190px;

        margin-bottom:0;
    }


    .logo{

        width:215px;
        height:215px;
    }


    .title{

        font-size:34px;
    }


    .subtitle{

        font-size:17px;

        margin-top:17px;
    }


    .website-button{

        width:90%;

        max-width:300px;

        margin-top:24px;

        padding:13px 24px;

        font-size:16px;
    }

}


/* ================= SMALL HEIGHT ================= */

@media(max-height:700px){

    .logo-wrapper{

        transform:scale(.75);

        margin-top:-30px;

        margin-bottom:-45px;
    }


    .subtitle{

        margin-top:12px;
    }


    .website-button{

        margin-top:18px;
    }

}

</style>

</head>


<body>


<div class="page">


<main class="content">


<!-- ================= LOGO ================= -->

<div class="logo-wrapper">

    <img

        id="mainLogo"

        class="logo"

        src="https://i.postimg.cc/HJ75HTMD/Untitled-design.png"

        alt="Logo"

        loading="eager"

        decoding="async"

        onerror="this.style.display='none';"

    >

</div>


<!-- ================= TITLE ================= -->

<h1 class="title">

    เดี๋ยวเราจะกลับมา

</h1>


<!-- ================= SUBTITLE ================= -->

<p class="subtitle">

    เรากำลังเตรียมระบบให้พร้อมสำหรับการเปิดใช้งาน<br>

    โปรดกลับเข้ามาอีกครั้งเมื่อถึงเวลาที่กำหนด

</p>


<!-- ================= WEBSITE BUTTON ================= -->

<a

    class="website-button"

    href="https://flame-i7hr.onrender.com"

    target="_blank"

    rel="noopener noreferrer">

    เข้าสู่เว็บไซต์

</a>


<!-- ================= FOOTER ================= -->

<div class="footer">

    NP-404 • Next Generation Classroom System

</div>


</main>

</div>


</body>

</html>
