<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b6f51a">
<title>เว็บห้อง ม.4/4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --lime:#b6f51a;--lime-soft:#e8fca0;--green:#6fa300;--green-dark:#3f6200;
  --bg:#f7f7f7;--card:#fff;--text:#222;--muted:#777;--line:#e6e6e6;
  --shadow:0 4px 16px rgba(0,0,0,.06);--radius:20px;
  --red:#ffe1e1;--redInk:#b3261e;--yellow:#fff0c2;--yellowInk:#8a5a00;
  --sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;width:100%}
body{font-family:'Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden;width:100%;line-height:1.55}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;touch-action:manipulation}
input,select,textarea{font:inherit;font-size:16px;color:var(--text)}
img{display:block;max-width:100%}
a{color:var(--green)}
.hide{display:none!important}
.sub,.mu{color:var(--muted);font-size:13px}
.err{color:var(--redInk)}

#view{width:100%;min-height:100vh;min-height:100dvh;padding-bottom:calc(104px + var(--sab))}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:calc(16px + var(--sat)) 16px 8px}
.topbar h1{font-size:24px;flex:1;line-height:1.25;min-width:0}
.topbar .actions{display:flex;gap:10px;align-items:center}
.icon-btn{width:42px;height:42px;border-radius:14px;background:#efeff1;display:grid;place-items:center;font-size:24px;flex:none}
.brand-dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--lime);margin-right:8px;box-shadow:0 0 0 3px var(--lime-soft)}
.topsub{padding:0 16px 6px;color:var(--muted);font-size:14px}
.pill{background:var(--lime-soft);color:var(--green-dark);padding:6px 14px;border-radius:99px;font-size:13px;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}

/* ---------- notice ---------- */
.notice{background:#fbf6d0;padding:14px 46px 14px 18px;display:flex;gap:12px;align-items:flex-start;position:relative}
.notice svg{flex:none;margin-top:2px}
.notice h4{font-size:16px;margin-bottom:2px}.notice p{font-size:14px;line-height:1.5}
.notice .close{position:absolute;right:12px;top:10px;font-size:26px;color:#8a6d00}

/* ---------- profile card ---------- */
.profile-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin:8px 16px}
.profile-row{display:flex;align-items:center;gap:14px;padding:16px}
.avatar{width:56px;height:56px;border-radius:50%;border:2px solid var(--lime);background:#f3ffd0;display:grid;place-items:center;font-weight:700;color:var(--green);font-size:20px;flex:none}
.profile-row .info{flex:1;min-width:0}
.profile-row .name{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-row .sub{display:block}
.switch-btn{width:52px;height:52px;border-radius:16px;background:#eceef2;display:grid;place-items:center;flex:none}
.switch-btn svg{width:26px;height:26px}
.chips2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.chip2{border-radius:14px;padding:12px 14px;background:#f1f1f1;text-align:left}
.chip2 small{display:block;font-size:12px;color:#556}
.chip2 b{font-size:16px;font-weight:600}
.chip2.hl{background:linear-gradient(120deg,var(--lime-soft),var(--lime))}
.promo-strip{width:100%;background:linear-gradient(90deg,#e8fffb,#19d3c5);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;text-align:left;gap:10px}
.promo-strip div{min-width:0}
.promo-strip b{font-size:17px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.promo-strip small{font-size:13px}.promo-strip span{font-size:28px}

/* ---------- banner ---------- */
.banner{margin:12px 16px;border-radius:var(--radius);min-height:160px;background:linear-gradient(120deg,#d9ff6a,#7de3b5 60%,#4cc9f0);padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden;display:block;width:calc(100% - 32px);text-align:left;color:#173300}
.banner small{font-size:13px;opacity:.85}
.banner h2{font-size:24px;line-height:1.25;margin:4px 0 8px;max-width:80%}
.banner .circle{position:absolute;right:-30px;bottom:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.35)}
.banner>*{position:relative;z-index:1}.banner .circle{z-index:0}

/* ---------- tiles ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:8px 16px 16px}
.tile{background:var(--card);border-radius:14px;padding:14px 6px;text-align:center;box-shadow:var(--shadow);border:2px solid transparent;position:relative;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:transform .1s;color:#333}
.tile:active{transform:scale(.96)}
.tile .emo{font-size:30px;line-height:1;width:50px;height:50px;border-radius:16px;background:var(--lime-soft);display:grid;place-items:center}
.tile .emo svg{width:28px;height:28px}
.tile span.t{font-size:13px;line-height:1.25;word-break:break-word}
.tag-new{position:absolute;top:0;right:0;background:linear-gradient(135deg,#ff9a3c,#ff5a36);color:#fff;font-size:11px;padding:3px 10px;border-radius:0 12px 0 14px}

/* ---------- sections / cards ---------- */
.section-title{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 4px}
.section-title h3{font-size:19px}
.section-title a{color:var(--green);font-size:14px;font-weight:500;cursor:pointer}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin:12px 16px;padding:16px;position:relative}
.card .t{font-size:16px;font-weight:600;margin-bottom:2px;overflow-wrap:anywhere}
.card p{font-size:14px;overflow-wrap:anywhere}
.card.pinned{border:2px solid var(--lime)}
.cards-grid{display:grid;grid-template-columns:1fr}
.cards-grid .card{margin:8px 16px}
.cols3{display:grid;grid-template-columns:1fr}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:2px 11px;white-space:nowrap;font-weight:500;background:var(--lime-soft);color:var(--green-dark)}
.tag.ok{background:var(--lime-soft);color:var(--green-dark)}.tag.part{background:var(--yellow);color:var(--yellowInk)}.tag.no{background:var(--red);color:var(--redInk)}
.list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:4px 16px;margin:10px 16px}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-bottom:1px dashed var(--line);text-align:left}
.item:last-child{border:0}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 16px}
.sum3 .chip2 b{font-size:20px;display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 16px}
.stats .chip2 b{font-size:24px;display:block}
.in{color:#2e7d32}.out{color:#c62828}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty b{color:var(--text);display:block}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* ---------- forms / buttons ---------- */
label{font-size:14px;color:var(--muted);display:block;margin:12px 0 6px}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;padding:13px 16px;border-radius:99px;border:2px solid var(--line);background:#fff;outline:none;-webkit-appearance:none;appearance:none;min-height:50px}
input[type=file]{width:100%;padding:12px;border:2px dashed var(--line);border-radius:18px;background:#fff}
input[type=checkbox]{width:26px;height:26px;accent-color:var(--green)}
select{background-image:linear-gradient(45deg,transparent 50%,#777 50%),linear-gradient(135deg,#777 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
textarea{border-radius:18px;resize:none;min-height:96px;line-height:1.7}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
.search{margin:6px 16px 4px;width:calc(100% - 32px)}
.cta{display:block;width:calc(100% - 32px);margin:12px 16px;padding:16px;border-radius:16px;background:var(--lime);color:#222;font-size:18px;font-weight:700;transition:.15s;text-align:center}
.cta:active,.btn:active,.tile:active{transform:scale(.97)}
.cta.inline{width:100%;margin:16px 0 0}
.cta.ghost{background:#fff;border:2px solid var(--line)}
.btn{padding:10px 18px;border-radius:99px;font-size:14px;background:#fff;border:2px solid var(--line);white-space:nowrap}
.btn.p{background:var(--lime);border-color:var(--lime);font-weight:600}
.btn.sm{padding:6px 14px;font-size:13px}
.btn.r{color:var(--redInk);border-color:#f3c6c6}
.btn:disabled{opacity:.5}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:14px 16px;line-height:1.7}
.row2{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.row2>select{width:140px}.row2>input{flex:1;min-width:140px}

/* ---------- bottom nav ---------- */
#nav{position:fixed;left:0;bottom:0;width:100%;height:calc(84px + var(--sab));background:#fff;border-top:1px solid #eee;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-bottom:calc(10px + var(--sab));z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:#555}
.tab svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--green);font-weight:700}
.scan{position:relative}
.scan .bubble{position:absolute;top:-34px;left:50%;transform:translateX(-50%);width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 -4px 14px rgba(0,0,0,.05)}
.scan .bubble i{width:56px;height:56px;border-radius:50%;background:var(--lime);display:grid;place-items:center;color:#222}
.scan span{margin-top:38px}

/* ---------- sheet / toast ---------- */
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:.25s}
#sheetBg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;width:100%;background:#fff;border-radius:28px 28px 0 0;z-index:41;transform:translateY(105%);transition:transform .3s;max-height:90vh;max-height:90dvh;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 20px calc(24px + var(--sab))}
#sheet.on{transform:none}
#sheet .grab{width:48px;height:6px;border-radius:6px;background:#ddd;margin:0 auto 14px}
#sheet h2{font-size:22px;margin-bottom:8px}
#sheet .grid{padding:0 0 8px}
#sheet .tile{box-shadow:none;background:#fafafa}
#toast{position:fixed;left:50%;bottom:calc(104px + var(--sab));transform:translate(-50%,20px);background:#222;color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.fade{animation:fade .35s}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media print{#nav,.topbar,.cta,.search,.acts{display:none!important}body.hasNav #view{padding:0!important}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:360px){
  .grid{gap:8px;padding-left:12px;padding-right:12px}
  .tile span.t{font-size:12px}.banner h2{font-size:20px}
}

/* ---------- tablet / iPad ---------- */
@media(min-width:768px){
  .topbar{padding:calc(24px + var(--sat)) 28px 8px}.topbar h1{font-size:30px}
  .topsub{padding:0 28px 6px}
  .profile-card,.banner,.card,.list{margin-left:28px;margin-right:28px}
  .banner{width:calc(100% - 56px);min-height:200px;padding:30px 36px}.banner h2{font-size:32px}
  .grid{gap:16px;padding:12px 28px 20px}
  .tile{min-height:130px}.tile .emo{width:60px;height:60px;font-size:34px}.tile span.t{font-size:15px}
  .chips2{grid-template-columns:repeat(4,1fr)}
  .section-title{padding:12px 32px 4px}
  .cards-grid{grid-template-columns:1fr 1fr;padding:0 18px}.cards-grid .card{margin:10px}
  .cols3{grid-template-columns:repeat(3,1fr);padding:0 18px}.cols3 .card{margin:10px}
  .cta{width:calc(100% - 56px);margin-left:28px;margin-right:28px}
  .search{margin-left:28px;margin-right:28px;width:calc(100% - 56px)}
  .sum3,.stats{margin-left:28px;margin-right:28px}
  .notice{padding-left:28px}
  #sheet{left:50%;right:auto;top:50%;bottom:auto;width:min(640px,92vw);max-height:86vh;border-radius:28px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:.25s}
  #sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  #sheet .grab{display:none}
}

/* ---------- desktop / laptop : sidebar ---------- */
@media(min-width:1100px){
  body.hasNav #view{padding-left:248px;padding-bottom:40px}
  #nav{top:0;bottom:0;left:0;width:248px;height:100vh;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:92px 16px 20px;border-top:0;border-right:1px solid var(--line)}
  #nav::before{content:"ห้อง ม.4/4";position:absolute;top:26px;left:34px;font-weight:700;font-size:22px;color:var(--green-dark)}
  #nav::after{content:"";position:absolute;top:36px;left:16px;width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px var(--lime-soft)}
  .tab{flex-direction:row;gap:14px;font-size:16px;padding:12px 16px;border-radius:14px}
  .tab svg{width:26px;height:26px}
  .tab:hover{background:#f3f3f3}
  .tab.on{background:var(--lime-soft)}
  .scan{order:-1;margin-bottom:8px;background:var(--lime);color:#222;font-weight:700}
  .scan:hover{background:var(--lime)}
  .scan .bubble{position:static;transform:none;width:auto;height:auto;background:none;box-shadow:none}
  .scan .bubble i{width:auto;height:auto;background:none}
  .scan span{margin-top:0}
  .tile:hover{border-color:var(--lime);transform:translateY(-2px)}
  .cards-grid{grid-template-columns:repeat(3,1fr)}
  .home-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:8px;align-content:start;padding:0 20px}
  .home-grid .notice{grid-column:1/-1;border-radius:16px;margin:20px 8px 8px}
  .home-grid .tiles,.home-grid .cols3{grid-column:1/-1}
  .home-grid .grid{grid-template-columns:repeat(8,1fr);padding-left:8px;padding-right:8px}
  .home-grid .profile-card,.home-grid .banner{margin-left:8px;margin-right:8px}
  .home-grid .banner{width:auto;margin-top:8px;min-height:230px}
  #toast{bottom:40px;left:calc(50% + 124px)}
  #sheet .grid{grid-template-columns:repeat(4,1fr)}
}
@media(min-width:1600px){html{font-size:17px}}
</style>
</head>

<nav id="nav" class="hide"></nav>

<div id="toast" role="status"></div>

async function login(){
 let id=$('#ae').value.trim();const pw=$('#ap').value;
 if(!id||!pw)return toast('กรอกชื่อหรืออีเมล และรหัสผ่านก่อน');
 if(!id.includes('@')){const r=await db.rpc('login_email',{u:id});if(r.error)return toast(em(r.error));if(!r.data)return toast('ไม่พบชื่อนี้ ลองใช้อีเมลแทน หรือสมัครสมาชิกก่อน');id=r.data}
 const r2=await db.auth.signInWithPassword({email:id,password:pw});
 if(r2.error)return toast('เข้าสู่ระบบไม่สำเร็จ: '+em(r2.error));
 closeSheet();boot();
}
async function signup(){
 const n=$('#an').value.trim(),e=$('#ae').value.trim();
 if(!n)return toast('กรอกชื่อ-สกุลก่อนสมัคร');if(!e)return toast('กรอกอีเมลก่อนสมัคร');
 const t=await db.rpc('name_taken',{n:n});if(t.error)return toast(em(t.error));if(t.data)return toast('ชื่อนี้มีคนใช้แล้ว เพิ่มนามสกุลหรือเลขท้ายให้ต่างกัน');
 const r=await db.auth.signUp({email:e,password:$('#ap').value,options:{data:{name:n}}});
 if(r.error)return toast(em(r.error));
 if(r.data.session){closeSheet();boot()}else toast('สมัครแล้ว กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ');
}
async function logout(){await db.auth.signOut();if(ch)db.removeChannel(ch);location.reload()}

async function boot(){
 const v=$('#view');
 if(!db){v.innerHTML='<div class="card"><p class="err">โหลดไลบรารี Supabase ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้านี้</p></div>';return}
 try{
  const s=await db.auth.getSession(),session=s.data&&s.data.session;
  if(session){
   const p=await db.from('profiles').select('*').eq('id',session.user.id).single();
   ME=p.data||{id:session.user.id,email:session.user.email,name:session.user.email,role:'student',perms:[]};
  }else ME={role:'guest',name:'ผู้เยี่ยมชม',perms:[]};
  LOCK=((await db.from('locked_modules').select('module')).data||[]).map(x=>x.module);
  if(ch)db.removeChannel(ch);
  ch=db.channel('rt').on('postgres_changes',{event:'*',schema:'public',table:'items'},function(p){
   const n=p.new||{};
   if(p.eventType==='INSERT'&&(n.module==='announce'||n.module==='homework'))toast('🔔 มี'+M[n.module][0]+'ใหม่');
   if(!n.module||n.module===cur){
    const a=document.activeElement;
    if(!$('#sheet').classList.contains('on')&&!(a&&a.id==='qs'))show(cur,1);
   }
  }).subscribe();
  if(!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(SB_URL))toast('SB_URL ไม่ถูกต้อง ต้องหน้าตาแบบ https://xxxx.supabase.co (ไม่มี / ท้าย)');
  document.body.classList.add('hasNav');$('#nav').classList.remove('hide');
  stack=[];show('home');
 }catch(e){v.innerHTML='<div class="card"><p class="err">'+esc(em(e))+'</p></div>'}
}

async function show(m,silent){
 cur=m;if(!silent){Q='';scrollTo(0,0)}drawNav();
 const v=$('#view');
 if(!silent)v.innerHTML=head(esc(title(m)),{back:m!=='home'&&m!=='menu'})+'<p class="hint">กำลังโหลด...</p>';
 try{
  if(isG()&&(LOCK.includes(m)||ADMIN_ONLY.includes(m)))return gate(v,m);
  if(ADMIN_ONLY.includes(m)&&!isA())throw Error('เฉพาะผู้ดูแล');
  await (SP[m]||list)(m,v);
 }catch(e){v.innerHTML=head(esc(title(m)),{back:m!=='home'&&m!=='menu'})+'<div class="card"><p class="err">'+esc(em(e))+'</p></div>'}
}

// ====== รายการทั่วไป ======
const q=m=>db.from('items').select('*').eq('module',m).is('deleted_at',null).order('created_at',{ascending:false}).limit(500);
async function list(m,v){
 let r=await q(m);if(r.error)throw r.error;let data=r.data||[];
 if(m==='announce'){if(!canEdit(m))data=data.filter(x=>!x.data.date||x.data.date<=today());data.sort((a,b)=>(b.data.pin==='ปัก')-(a.data.pin==='ปัก'))}
 if(m==='poll')VOTES=(await q('vote')).data||[];
 ROWS=data;const t=M[m][0],ic=M[m][1],w=M[m][3],add=canEdit(m)||w==='u';
 v.innerHTML=head(ic+' '+t,{back:1})+(add?'<button class="cta" data-act="openForm" data-m="'+m+'">+ เพิ่ม'+(m==='chat'?'ข้อความ':'')+'</button>':'')+
  (m==='money'?sum(data):'')+'<input type="text" class="search" id="qs" placeholder="ค้นหา..." value="'+esc(Q)+'" autocomplete="off"><div id="ls" class="cards-grid"></div>';
 paint(m);
}
function sum(d){let i=0,o=0;d.forEach(x=>x.data.type==='รายจ่าย'?o+=+x.data.amount||0:i+=+x.data.amount||0);
 return '<div class="sum3"><div class="chip2"><small>รายรับ</small><b class="in">'+i.toLocaleString()+'</b></div><div class="chip2"><small>รายจ่าย</small><b class="out">'+o.toLocaleString()+'</b></div><div class="chip2 hl"><small>คงเหลือ</small><b>'+(i-o).toLocaleString()+'</b></div></div>'}
function paint(m){const s=Q.toLowerCase(),r=ROWS.filter(x=>!s||JSON.stringify(x.data).toLowerCase().includes(s));
 $('#ls').innerHTML=r.length?r.map(x=>card(m,x)).join(''):'<div class="card empty" style="grid-column:1/-1"><b>ยังไม่มีข้อมูล</b>'+(canEdit(m)||M[m][3]==='u'?'กด “+ เพิ่ม” เพื่อเริ่มต้น':'')+'</div>'}
const safeUrl=u=>/^https?:\/\//i.test(String(u||''));
function card(m,r){
 const F=M[m][2],d=r.data||{},ed=canEdit(m);let h;
 if(m==='chat'){h='<div class="card fade"><p>'+esc(d.msg)+'</p><p class="mu">'+new Date(r.created_at).toLocaleString('th-TH')+'</p>'}
 else{
  h='<div class="card fade'+(d.pin==='ปัก'?' pinned':'')+'"><div class="t">'+(d.pin==='ปัก'?'📌 ':'')+esc(d[F[0][0]])+'</div>';
  F.slice(1).forEach(function(f){
   const k=f[0],l=f[1],t=f[2];let v=d[k];if(k==='status'&&!v)v='รออนุมัติ';if(!v||k==='pin')return;
   let val;
   if(t==='file')val=safeUrl(v)?'<a href="'+esc(v)+'" target="_blank" rel="noopener">เปิดไฟล์</a>':esc(v);
   else if(k==='status')val='<span class="tag '+st(v)+'">'+esc(v)+'</span>';
   else if(t==='date')val=esc(fd(v));
   else val=esc(v);
   h+='<p><span class="mu">'+l+':</span> '+val+'</p>';
  });
 }
 if(m==='poll'){
  const o=(d.opts||'').split(',').map(s=>s.trim()).filter(Boolean),vs=VOTES.filter(x=>x.data.poll===r.id),mine=ME&&vs.some(x=>x.created_by===ME.id);
  h+='<div class="acts">'+o.map(c=>'<button class="btn sm" '+(d.status==='ปิด'||mine?'disabled':'')+' data-act="vote" data-poll="'+esc(r.id)+'" data-c="'+esc(c)+'">'+esc(c)+' · '+vs.filter(x=>x.data.choice===c).length+'</button>').join('')+'</div>';
 }
 if(ed)h+='<div class="acts"><button class="btn sm" data-act="openForm" data-m="'+m+'" data-id="'+esc(r.id)+'">แก้ไข</button><button class="btn sm r" data-act="del" data-id="'+esc(r.id)+'">ลบ</button></div>';
 return h+'</div>';
}
async function vote(poll,choice){
 if(isG())return authChoice();

function inp(k,t,v){t=t||'';v=esc(v==null?'':v);
 if(t==='ta')return '<textarea id="f_'+k+'">'+v+'</textarea>';
 if(t.startsWith('sel:'))return '<select id="f_'+k+'">'+t.slice(4).split(',').map(o=>'<option '+(o===v?'selected':'')+'>'+o+'</option>').join('')+'</select>';
 const ty={date:'date',num:'number',file:'file'}[t]||'text';
 return '<input id="f_'+k+'" type="'+ty+'" '+(t==='file'?'':'value="'+v+'"')+' autocomplete="off">';
}
function openForm(m,id){
 if(isG())return authChoice();
 const r=ROWS.find(x=>x.id===id),d=(r&&r.data)||{},F=M[m][2].filter(f=>f[3]!=='a'||canEdit(m));
 openSheet('<h2>'+(r?'แก้ไข':'เพิ่ม')+' '+M[m][0]+'</h2>'+F.map(f=>'<label>'+f[1]+'</label>'+inp(f[0],f[2],d[f[0]])).join('')+'<button class="cta inline" data-act="save" data-m="'+m+'" data-id="'+esc(id||'')+'">บันทึก</button>');
}
async function save(m,id){
 const old=ROWS.find(x=>x.id===id),d=Object.assign({},(old&&old.data)||{});
 for(const f of M[m][2]){
  const k=f[0],t=f[2],e=$('#f_'+k);if(!e)continue;
  if(t==='file'){
   const file=e.files[0];
   if(file){
    const p=ME.id+'/'+Date.now()+'-'+file.name.replace(/[^\w.-]/g,'_');
    const u=await db.storage.from('files').upload(p,file);
    if(u.error)return toast('อัปโหลดไม่สำเร็จ: '+u.error.message);
    d[k]=db.storage.from('files').getPublicUrl(p).data.publicUrl;
   }
  }else d[k]=e.value.trim();
 }
 if(!String(d[M[m][2][0][0]]||'').trim())return toast('กรอก “'+M[m][2][0][1]+'” ก่อนบันทึก');
 const r=await (id?db.from('items').update({data:d}).eq('id',id):db.from('items').insert({module:m,data:d,created_by:ME.id}));
 if(r.error)return toast(r.error.message);
 closeSheet();toast('บันทึกแล้ว');show(m,1);
}

 v.innerHTML=head('ห้อง ม.4/4',{brand:1})+'<div class="home-grid">'+notice+
  profileCard()+'<div class="chips2">'+['schedule','attendance','money','leave'].map(chip).join('')+'</div>'+
  '<button class="promo-strip" data-act="go" data-v="announce"><div><b>'+(ann[0]?esc(ann[0].data.title):'ยังไม่มีประกาศ')+'</b><small>ประกาศล่าสุดจากหัวหน้าห้อง</small></div><span>›</span></button></div>'+
  banner+
  '<div class="tiles"><div class="grid">'+
   tile('🗓️','ตารางเรียน','go',{v:'schedule'})+tile('✅','เช็กชื่อ','go',{v:'attendance'})+tile('💰','เงินห้อง','go',{v:'money'})+tile('📚','การบ้าน','go',{v:'homework'})+
   tile('🗂️','คลังเอกสาร','go',{v:'docs'})+tile('🎯','กิจกรรมห้อง','go',{v:'activity'})+tile('📆','ปฏิทินห้อง','go',{v:'calendar'})+tile(svg('more'),'เมนูทั้งหมด','nav',{v:'menu',isNew:1})+

async function setLock(k,on){
 const r=await (on?db.from('locked_modules').upsert({module:k}):db.from('locked_modules').delete().eq('module',k));
 if(r.error)return toast(r.error.message);
 LOCK=on?LOCK.concat([k]):LOCK.filter(x=>x!==k);toast('บันทึกแล้ว');
}

SP.reports=function(m,v){
 v.innerHTML=head('📤 รายงานและส่งออก',{back:1,sub:'CSV เปิดใน Excel ได้ · PDF ใช้ปุ่มพิมพ์แล้วเลือก “บันทึกเป็น PDF”'})+'<div class="grid">'+
  Object.keys(M).filter(k=>M[k][2]).map(k=>tile(M[k][1],M[k][0],'csv',{v:k})).join('')+'</div>'+
  '<button class="cta" data-act="backup">💾 สำรองข้อมูลทั้งหมด (JSON)</button><button class="cta ghost" data-act="printPage">🖨️ พิมพ์ / PDF</button>';
};
function dl(n,t,s){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function csv(k){
 const r=await q(k),F=M[k][2],c=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
 dl(k+'-'+today()+'.csv','text/csv;charset=utf-8','﻿'+[F.map(f=>c(f[1]))].concat((r.data||[]).map(row=>F.map(f=>c(row.data[f[0]])))).map(x=>x.join(',')).join('\r\n'));
}
async function backup(){const r=await db.from('items').select('*').limit(10000);dl('backup-'+today()+'.json','application/json',JSON.stringify(r.data||[]))}

// ====== events ======
const A={
 closeSheet:closeSheet,
 closeNotice(){const n=$('#notice');if(n)n.remove()},
 nav(t){stack=[];closeSheet();show(t.dataset.v)},
 go(t){closeSheet();stack.push(cur);show(t.dataset.v)},
 back(){show(stack.length?stack.pop():(NAVK.includes(cur)?'home':'menu'))},
 authChoice:authChoice,loginSheet:loginSheet,signupSheet:signupSheet,
 login:login,signup:signup,logout:logout,
 openForm(t){openForm(t.dataset.m,t.dataset.id||undefined)},
 save(t){save(t.dataset.m,t.dataset.id||'')},
 del(t){del(t.dataset.id)},
 vote(t){vote(t.dataset.poll,t.dataset.c)},
 setRole(t){setRole(t.dataset.id)},
 restore(t){restore(t.dataset.id)},
 csv(t){csv(t.dataset.v)},
 backup:backup,
 printPage(){window.print()}
};
document.addEventListener('click',function(e){
 const t=e.target.closest('[data-act]');if(!t||t.type==='checkbox')return;
 const f=A[t.dataset.act];if(f){e.preventDefault();Promise.resolve(f(t,e)).catch(function(x){toast(em(x))})}
});
document.addEventListener('change',function(e){
 const t=e.target;
 if(t&&t.type==='checkbox'&&t.dataset.act==='setLock')setLock(t.dataset.k,t.checked);
});
document.addEventListener('input',function(e){
 if(e.target&&e.target.id==='qs'){Q=e.target.value;paint(cur)}
});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape')closeSheet();
 if(e.key==='Enter'&&e.target&&e.target.id==='ap'){e.preventDefault();($('#an')?signup:login)()}
});

boot();
})();
</script>
