<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{font-family:"Kanit",sans-serif;overflow:hidden}
.page{width:100%;min-height:100svh;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;color:#fff;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.16),transparent 38%),radial-gradient(circle at 50% 50%,rgba(255,255,255,.06),transparent 60%),#6593c7}
.page::before{content:"";position:absolute;width:650px;height:650px;left:50%;top:40%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.13),rgba(255,255,255,.04) 35%,transparent 70%);filter:blur(35px);animation:backgroundPulse 5s ease-in-out infinite}
.content{width:min(92%,1000px);position:relative;z-index:5;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 15px}
.logo-wrapper{width:310px;height:230px;display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:5px}
.logo-wrapper::before{content:"";position:absolute;width:260px;height:180px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.45),rgba(255,255,255,.12) 35%,transparent 72%);filter:blur(28px);animation:logoPulse 4s ease-in-out infinite}
.logo{width:260px;height:260px;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 0 5px rgba(255,255,255,.9)) drop-shadow(0 0 20px rgba(255,255,255,.55)) drop-shadow(0 0 45px rgba(255,255,255,.25));animation:logoFloat 4s ease-in-out infinite;transition:opacity 0.5s ease}
.title{font-family:"Kanit",sans-serif;font-size:clamp(34px,5vw,58px);font-weight:700;letter-spacing:-1.5px;line-height:1.25;text-shadow:0 3px 15px rgba(0,0,0,.06);animation:fadeUp .9s ease both}
.subtitle{margin-top:20px;font-size:clamp(17px,2.2vw,25px);line-height:1.7;color:rgba(255,255,255,.94);max-width:850px;animation:fadeUp .9s .12s ease both}
.launch-date{margin-top:18px;font-size:clamp(15px,1.8vw,20px);color:rgba(255,255,255,.82);animation:fadeUp .9s .2s ease both}
.countdown{margin-top:27px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;animation:fadeUp .9s .28s ease both}
.time-box{min-width:88px;padding:13px 15px 12px;border-radius:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.time-number{display:block;font-size:30px;font-weight:700;line-height:1.1}
.time-label{display:block;margin-top:5px;font-size:12px;opacity:.72}
.colon{font-size:25px;font-weight:700;opacity:.65}
.progress-section{width:min(90%,620px);margin-top:31px;animation:fadeUp .9s .38s ease both}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:14px;color:rgba(255,255,255,.85)}
.percent{font-weight:700}
.progress-bar{width:100%;height:9px;border-radius:99px;background:rgba(255,255,255,.20);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.progress-fill{width:0%;height:100%;border-radius:99px;background:linear-gradient(90deg,rgba(255,255,255,.55),rgba(255,255,255,1));box-shadow:0 0 15px rgba(255,255,255,.55);transition:width .8s ease}
.status{margin-top:18px;font-size:14px;color:rgba(255,255,255,.72)}
.status-dot{width:7px;height:7px;display:inline-block;margin-right:7px;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.9);animation:statusBlink 1.6s ease-in-out infinite}
.footer{margin-top:20px;font-size:12px;opacity:.55}
.download-btn{margin-top:25px;padding:12px 28px;font-size:15px;font-family:"Kanit",sans-serif;font-weight:600;color:#6593c7;background:#ffffff;border:none;border-radius:30px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.15);transition:transform .2s ease,box-shadow .2s ease;animation:fadeUp .9s .45s ease both}
.download-btn:hover{transform:translateY(-2px);box-shadow:0 12px 25px rgba(0,0,0,.25)}
.download-btn:active{transform:translateY(0)}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes logoPulse{0%,100%{opacity:.65;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
@keyframes backgroundPulse{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes statusBlink{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

<body>
<div class="page">
<main class="content">
<div class="logo-wrapper">
<img id="appLogo" class="logo" src="https://i.postimg.cc/HJ75HTMD/Untitled-design.png" alt="NP-404 Logo" style="opacity: 1;">
</div>

<h1 class="title">เดี๋ยวเราจะกลับมา</h1>

<p class="subtitle">
เรากำลังเตรียมระบบให้พร้อมสำหรับการเปิดใช้งาน<br>
โปรดกลับเข้ามาอีกครั้งเมื่อถึงเวลาที่กำหนด
</p>

<div class="launch-date">
เปิดใช้งานอย่างเป็นทางการ
<strong>13 กันยายน 2569 เวลา 13:13:13 น.</strong>
</div>

<div class="countdown">
<div class="time-box"><span id="days" class="time-number">02</span><span class="time-label">วัน</span></div>
<span class="colon">:</span>
<div class="time-box"><span id="hours" class="time-number">01</span><span class="time-label">ชั่วโมง</span></div>
<span class="colon">:</span>
<div class="time-box"><span id="minutes" class="time-number">49</span><span class="time-label">นาที</span></div>
<span class="colon">:</span>
<div class="time-box"><span id="seconds" class="time-number">10</span><span class="time-label">วินาที</span></div>
</div>

<div class="progress-section">
<div class="progress-header">
<span>กำลังเตรียมระบบ</span>
<span id="percent" class="percent">18.62%</span>
</div>
<div class="progress-bar"><div id="progressFill" class="progress-fill" style="width: 18.622398%;"></div></div>
</div>

<div class="status"><span class="status-dot"></span>ระบบกำลังเตรียมความพร้อม</div>

<!-- ปุ่มดาวน์โหลดไฟล์ index.html ในหน้าเว็บ -->
<button class="download-btn" onclick="downloadCurrentPage()">📥 ดาวน์โหลดไฟล์ index.html</button>

<div class="footer">NP-404 • Next Generation Classroom System</div>
</main>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwNzOPeq1ySwZET-yNLabubjiGx-BsLjTpuWuV6cz0AG1MEBkggvSEh6bCnHq5lH7WB/exec";

async function fetchLogoFromSheet() {
    const logoImg = document.getElementById("appLogo");
    try {
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();
        const imageUrl = typeof data === 'string' ? data : (data.logoUrl || data.url || data.image);
        
        if (imageUrl) {
            logoImg.src = imageUrl;
            logoImg.onload = () => { logoImg.style.opacity = "1"; };
        } else {
            logoImg.src = "https://i.postimg.cc/HJ75HTMD/Untitled-design.png";
            logoImg.style.opacity = "1";
        }
    } catch (error) {
        console.error("Error fetching data from Apps Script:", error);
        logoImg.src = "https://i.postimg.cc/HJ75HTMD/Untitled-design.png";
        logoImg.style.opacity = "1";
    }
}

fetchLogoFromSheet();

const launchTime = new Date("2026-09-13T13:13:13+07:00").getTime();
const startTime = new Date("2026-09-11T00:00:00+07:00").getTime();

const days = document.getElementById("days");
const hours = document.getElementById("hours");
const minutes = document.getElementById("minutes");
const seconds = document.getElementById("seconds");
const percent = document.getElementById("percent");
const progressFill = document.getElementById("progressFill");

function pad(n) { return String(n).padStart(2, "0"); }

function updateSystem() {
    const now = Date.now();
    const remaining = launchTime - now;

    if (remaining <= 0) {
        days.textContent = "00";
        hours.textContent = "00";
        minutes.textContent = "00";
        seconds.textContent = "00";
        percent.textContent = "100%";
        progressFill.style.width = "100%";
        document.querySelector(".title").textContent = "ระบบพร้อมใช้งานแล้ว";
        document.querySelector(".subtitle").innerHTML = "ยินดีต้อนรับเข้าสู่ระบบ NP-404";
        document.querySelector(".status").innerHTML = '<span class="status-dot"></span>ระบบเปิดใช้งานแล้ว';
        return;
    }

    const totalSeconds = Math.floor(remaining / 1000);
    const d = Math.floor(totalSeconds / 86400);
    const h = Math.floor((totalSeconds % 86400) / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;

    days.textContent = pad(d);
    hours.textContent = pad(h);
    minutes.textContent = pad(m);
    seconds.textContent = pad(s);

    const totalDuration = launchTime - startTime;
    const elapsed = now - startTime;
    let progress = (elapsed / totalDuration) * 100;
    progress = Math.max(0, Math.min(100, progress));

    percent.textContent = progress.toFixed(2) + "%";
    progressFill.style.width = progress + "%";
}

updateSystem();
setInterval(updateSystem, 1000);

// ฟังก์ชันสำหรับกดดาวน์โหลดโค้ด HTML เป็นไฟล์ index.html
function downloadCurrentPage() {
    const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "index.html";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
</script>


</body></html>
